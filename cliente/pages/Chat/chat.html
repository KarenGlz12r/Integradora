<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotriCare – Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <div id="navbar"></div>
    <main class="main-content">
        <div class="chat-toast" id="chatToast"></div>

        <!-- ══════════════════════════════════════════════════════
             SIDEBAR: lista de conversaciones con pacientes
        ══════════════════════════════════════════════════════ -->
        <aside class="chat-sidebar" id="chatSidebar">

            <div class="chat-sb-header">
                <div class="chat-sb-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <div class="chat-sb-title">Mensajes</div>
                    <div class="chat-sb-sub">Fisioterapeuta</div>
                </div>
            </div>

            <div class="chat-sb-search">
                <input type="text" placeholder="Buscar paciente..." id="chatSearch" oninput="filtrarConvs()">
            </div>

            <div class="chat-conv-list" id="chatConvList">
                <div id="chatConvLoading"
                    style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">
                    Cargando conversaciones...
                </div>
            </div>

        </aside>

        <!-- ══════════════════════════════════════════════════════
             PANEL PRINCIPAL
        ══════════════════════════════════════════════════════ -->
        <main class="chat-main" id="chatMain">
            <div class="chat-bg-pattern"></div>

            <div class="chat-empty" id="chatEmptyState">
                <div class="chat-empty-icon">
                    <i class="fa-solid fa-message" style="font-size:28px;color:var(--color-primary);"></i>
                </div>
                <h2>MotriCare Chat</h2>
                <p>Selecciona un paciente para iniciar la conversación</p>
            </div>

            <div class="chat-active-panel" id="chatActivePanel" style="display:none;">

                <div class="chat-panel-header">
                    <button class="chat-icon-btn" id="chatBackBtn" style="display:none;" onclick="volverSidebarChat()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="chat-c-avatar hd" id="chatHeaderAvatar">P</div>
                    <div class="chat-panel-header-info">
                        <div class="chat-panel-name" id="chatHeaderName">Paciente</div>
                        <div class="chat-panel-status" id="chatHeaderStatus">en línea</div>
                    </div>
                    <button class="chat-icon-btn" title="Info del paciente"
                        onclick="mostrarToastChat('Perfil del paciente: próximamente')">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                </div>

                <div class="chat-messages-area" id="chatMessagesArea"></div>

                <div class="chat-input-area">
                    <button class="chat-icon-btn" title="Adjuntar"
                        onclick="mostrarToastChat('Adjuntar archivos: próximamente')">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <div class="chat-input-wrap">
                        <textarea id="chatMsgInput" rows="1" placeholder="Escribe un mensaje..."
                            oninput="chatAutoResize(this)" onkeydown="chatHandleKey(event)"></textarea>
                    </div>
                    <button class="chat-send-btn" onclick="chatEnviarMensaje()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

            </div>
        </main>
    </main>

    <!-- Navbar dinámico -->
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>

    <!-- ══════════════════════════════════════════════════════
         LÓGICA PRINCIPAL DEL CHAT
    ══════════════════════════════════════════════════════ -->
    <script>
        /* ─────────────────────────────────────────────────────
           CONFIGURACIÓN DE SUPABASE
        ───────────────────────────────────────────────────── */
        const SUPABASE_URL = 'https://qhrennyqjhngysortocu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq';
        const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ─────────────────────────────────────────────────────
           VARIABLES GLOBALES
           
           FISIO_ID      = auth.users.id  → usado en mensajes.id_emisor
           FISIO_REAL_ID = fisioterapeutas.id → usado en conversaciones.id_fisio
           
           Del paciente:
           El sessionStorage puede traer el id_us (usuario.id_us)
           o el auth.users.id según desde qué pantalla se llega.
           chatInit() detecta cuál es y siempre trabaja con id_us
           para conversaciones, y con el auth.users.id solo para
           mensajes.id_emisor.
        ───────────────────────────────────────────────────── */
        let FISIO_ID      = null;
        let FISIO_REAL_ID = null;
        let FISIO_FOTO    = null;

        let convActiva = null;
        let todasConvs = [];
        let rtChannel  = null;


        /* ═══════════════════════════════════════════════════════
           BADGE HELPER
        ═══════════════════════════════════════════════════════ */
        function chatActualizarBadge() {
            setTimeout(() => {
                if (window.recalcularBadgeGlobal) window.recalcularBadgeGlobal();
            }, 300);
        }


        /* ═══════════════════════════════════════════════════════
           INICIALIZACIÓN
        ═══════════════════════════════════════════════════════ */
        async function chatInit() {
            console.log('[chatInit] Iniciando...');

            const { data: { user }, error } = await _sb.auth.getUser();
            if (error || !user) {
                console.error('[chatInit] Sin sesión:', error);
                mostrarToastChat('⚠️ Sin sesión activa');
                return;
            }
            FISIO_ID = user.id;
            console.log('[chatInit] FISIO_ID (auth.users.id):', FISIO_ID);

            // Obtener el id interno del fisioterapeuta (fisioterapeutas.id)
            const { data: fisioRow, error: fisioErr } = await _sb
                .from('fisioterapeutas')
                .select('id')
                .eq('user_id', user.id)
                .single();

            console.log('[chatInit] fisioRow:', fisioRow, '| error:', fisioErr);

            if (!fisioRow) {
                mostrarToastChat('⚠️ Perfil de fisioterapeuta no encontrado');
                return;
            }
            FISIO_REAL_ID = fisioRow.id;
            console.log('[chatInit] FISIO_REAL_ID (fisioterapeutas.id):', FISIO_REAL_ID);

            // Foto del fisioterapeuta
            const { data: perfil } = await _sb
                .from('perfiles')
                .select('foto_url')
                .eq('id', user.id)
                .single();
            if (perfil?.foto_url) FISIO_FOTO = perfil.foto_url;

            await cargarConvs();
            chatEscucharRT();

            // ── Apertura directa desde pantalla de Pacientes ──────────────────
            // sessionStorage puede traer el id_us directamente (preferido)
            // o el auth.users.id como fallback.
            const pacienteIdPendiente     = sessionStorage.getItem('chatPacienteId');
            const pacienteNombrePendiente = sessionStorage.getItem('chatPacienteNombre');

            console.log('[chatInit] sessionStorage chatPacienteId:', pacienteIdPendiente);
            console.log('[chatInit] sessionStorage chatPacienteNombre:', pacienteNombrePendiente);

            if (pacienteIdPendiente) {
                sessionStorage.removeItem('chatPacienteId');
                sessionStorage.removeItem('chatPacienteNombre');
                await abrirOCrearConvPaciente(pacienteIdPendiente, pacienteNombrePendiente);
            }
        }


        /* ═══════════════════════════════════════════════════════
           RESOLVER DATOS DEL PACIENTE
           
           Dado cualquier identificador del paciente (puede llegar
           como id_us o como auth.users.id / user_id), devuelve
           siempre { id_us, us_nom, url_foto } o null.
           
           Orden de intento:
           1. usuario.id_us  (lo más probable cuando viene de la
              pantalla de pacientes que ya tiene el row de usuario)
           2. usuario.user_id (FK a auth.users, por si viene el
              auth UUID en su lugar)
        ═══════════════════════════════════════════════════════ */
        async function _resolverPaciente(idRecibido) {
            if (!idRecibido) return null;

            // Intento 1: el id recibido ES el id_us de la tabla usuario
            const { data: u1 } = await _sb
                .from('usuario')
                .select('id_us, us_nom, url_foto')
                .eq('id_us', idRecibido)
                .maybeSingle();

            if (u1?.id_us) {
                console.log('[_resolverPaciente] Resuelto por id_us:', u1);
                return u1;
            }

            // Intento 2: el id recibido es el auth.users.id (user_id FK)
            const { data: u2 } = await _sb
                .from('usuario')
                .select('id_us, us_nom, url_foto')
                .eq('user_id', idRecibido)
                .maybeSingle();

            if (u2?.id_us) {
                console.log('[_resolverPaciente] Resuelto por user_id:', u2);
                return u2;
            }

            console.error('[_resolverPaciente] ❌ No se encontró usuario para:', idRecibido);
            return null;
        }


        /* ═══════════════════════════════════════════════════════
           ABRIR O CREAR CONVERSACIÓN CON UN PACIENTE
           
           FIX PRINCIPAL:
           - Siempre resuelve usuario.id_us antes de tocar
             la tabla conversaciones.
           - NUNCA pasa el campo "id" al INSERT de conversaciones.
             Postgres lo genera automáticamente (gen_random_uuid()).
           - Recupera el UUID generado con .select('id').single()
             y ESE es el que se usa en mensajes.id_conv.
        ═══════════════════════════════════════════════════════ */
        async function abrirOCrearConvPaciente(idRecibido, pacienteNombre) {
            console.log('[abrirOCrearConv] idRecibido:', idRecibido, '| nombre:', pacienteNombre);
            console.log('[abrirOCrearConv] FISIO_REAL_ID:', FISIO_REAL_ID, '| FISIO_ID:', FISIO_ID);

            // Guardia básica
            if (!idRecibido) {
                console.error('[abrirOCrearConv] ❌ idRecibido es null/undefined');
                mostrarToastChat('⚠️ No se pudo identificar al paciente');
                return;
            }
            if (!FISIO_REAL_ID) {
                console.error('[abrirOCrearConv] ❌ FISIO_REAL_ID no disponible aún');
                mostrarToastChat('⚠️ Sesión del fisioterapeuta no lista');
                return;
            }

            // ── Paso 0: resolver siempre el id_us real del paciente ───────────
            const pacienteData = await _resolverPaciente(idRecibido);
            if (!pacienteData) {
                mostrarToastChat('⚠️ Paciente no encontrado en el sistema');
                return;
            }
            const pacienteIdUs = pacienteData.id_us;
            const nombre       = pacienteData.us_nom || pacienteNombre || 'Paciente';
            const fotoUrl      = pacienteData.url_foto || null;
            const iniciales    = nombre.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

            console.log('[abrirOCrearConv] ✅ pacienteIdUs:', pacienteIdUs, '| nombre:', nombre);

            // ── Paso 1: ¿ya existe la conversación? ───────────────────────────
            console.log('[abrirOCrearConv] Paso 1 → buscando conv existente...');
            const { data: convExistente, error: e1 } = await _sb
                .from('conversaciones')
                .select('id')
                .eq('id_fisio',    FISIO_REAL_ID)
                .eq('id_paciente', pacienteIdUs)
                .maybeSingle();

            console.log('[abrirOCrearConv] Paso 1 resultado:', convExistente, '| error:', e1);

            if (convExistente?.id) {
                console.log('[abrirOCrearConv] ✅ Conv existente:', convExistente.id);
                return _montarYAbrirConv(convExistente.id, pacienteIdUs, nombre, iniciales, fotoUrl);
            }

            // ── Paso 2: ¿hay mensajes huérfanos de este paciente? ─────────────
            // (El paciente inició el chat desde la app y hay mensajes pero
            //  no existe el row en conversaciones para este fisio)
            console.log('[abrirOCrearConv] Paso 2 → buscando mensajes huérfanos...');

            // Buscamos por id_us primero, luego por user_id como fallback
            let convIdHuerfana = null;

            const { data: mh1 } = await _sb
                .from('mensajes')
                .select('id_conv')
                .eq('id_emisor', pacienteIdUs)
                .not('id_conv', 'is', null)
                .limit(1)
                .maybeSingle();

            console.log('[abrirOCrearConv] Paso 2a (por id_us):', mh1);
            convIdHuerfana = mh1?.id_conv || null;

            if (!convIdHuerfana) {
                // Si el paciente envió con su auth.users.id como emisor
                const { data: mh2 } = await _sb
                    .from('mensajes')
                    .select('id_conv')
                    .eq('id_emisor', idRecibido)
                    .not('id_conv', 'is', null)
                    .limit(1)
                    .maybeSingle();

                console.log('[abrirOCrearConv] Paso 2b (por idRecibido):', mh2);
                convIdHuerfana = mh2?.id_conv || null;
            }

            if (convIdHuerfana) {
                console.log('[abrirOCrearConv] Conv huérfana detectada:', convIdHuerfana, '→ registrando...');
                // Registrar con upsert usando el id ya existente de los mensajes
                const { error: upsertErr } = await _sb.from('conversaciones').upsert(
                    {
                        id:          convIdHuerfana,   // id que YA existe en mensajes.id_conv
                        id_fisio:    FISIO_REAL_ID,
                        id_paciente: pacienteIdUs
                    },
                    { onConflict: 'id' }
                );
                if (upsertErr) console.error('[abrirOCrearConv] Error upsert huérfana:', upsertErr);
                else console.log('[abrirOCrearConv] ✅ Conv huérfana registrada');

                return _montarYAbrirConv(convIdHuerfana, pacienteIdUs, nombre, iniciales, fotoUrl);
            }

            // ── Paso 3: crear conversación nueva ──────────────────────────────
            // ✅ CRÍTICO: NO se pasa el campo "id".
            //    Postgres lo genera con gen_random_uuid().
            //    Se recupera con .select('id').single() para usarlo
            //    en todos los mensajes.id_conv posteriores.
            console.log('[abrirOCrearConv] Paso 3 → creando conv nueva (sin id manual):', {
                id_fisio:    FISIO_REAL_ID,
                id_paciente: pacienteIdUs
            });

            const { data: nueva, error: errConv } = await _sb
                .from('conversaciones')
                .insert({
                    // ✅ SIN "id" — Postgres genera el UUID automáticamente
                    id_fisio:    FISIO_REAL_ID,
                    id_paciente: pacienteIdUs
                })
                .select('id')
                .single();

            console.log('[abrirOCrearConv] Resultado INSERT nueva conv:', nueva, '| error:', errConv);

            if (errConv || !nueva?.id) {
                console.error('[abrirOCrearConv] ❌ Error creando conv:', errConv);
                mostrarToastChat('Error al abrir chat');
                return;
            }

            console.log('[abrirOCrearConv] ✅ Conv nueva creada. UUID generado por Postgres:', nueva.id);
            return _montarYAbrirConv(nueva.id, pacienteIdUs, nombre, iniciales, fotoUrl);
        }


        /* ═══════════════════════════════════════════════════════
           HELPER: construir objeto conv y llamar abrirConv()
           Centraliza la lógica para los 3 pasos anteriores.
        ═══════════════════════════════════════════════════════ */
        function _montarYAbrirConv(convId, pacienteIdUs, nombre, iniciales, fotoUrl) {
            console.log('[_montarYAbrirConv] convId:', convId);

            const conv = {
                id_conv:     convId,       // ← UUID real generado por Postgres
                paciente_id: pacienteIdUs, // ← usuario.id_us
                nombre,
                iniciales,
                fotoUrl,
                sinLeer: 0,
                ultimo:  null
            };

            const yaEsta = todasConvs.find(c => c.id_conv === convId);
            if (!yaEsta) todasConvs.unshift(conv);
            abrirConv(yaEsta || conv);
        }


        /* ═══════════════════════════════════════════════════════
           CARGAR TODAS LAS CONVERSACIONES DEL SIDEBAR
        ═══════════════════════════════════════════════════════ */
        async function cargarConvs() {
            console.log('[cargarConvs] FISIO_REAL_ID:', FISIO_REAL_ID);

            const { data: convRows, error } = await _sb
                .from('conversaciones')
                .select('id, id_paciente, ultimo_mensaje, ultimo_mensaje_fecha')
                .eq('id_fisio', FISIO_REAL_ID)
                .order('ultimo_mensaje_fecha', { ascending: false, nullsFirst: false });

            if (error) { console.error('[cargarConvs] Error:', error); return; }
            console.log('[cargarConvs] Rows encontradas:', convRows?.length, convRows);

            const convs = [];

            for (const row of (convRows || [])) {
                const pacienteIdUs = row.id_paciente;

                // Saltar filas con id_paciente inválido (las del bug anterior)
                if (!pacienteIdUs || pacienteIdUs === '00000000-0000-0000-0000-000000000000') {
                    console.warn('[cargarConvs] ⚠️ id_paciente inválido en conv', row.id, '— omitiendo');
                    continue;
                }

                const { count } = await _sb
                    .from('mensajes')
                    .select('*', { count: 'exact', head: true })
                    .eq('id_conv',   row.id)
                    .eq('msg_leido', false)
                    .neq('id_emisor', FISIO_ID);

                // Buscar nombre y foto del paciente por id_us
                const { data: u, error: uErr } = await _sb
                    .from('usuario')
                    .select('us_nom, url_foto')
                    .eq('id_us', pacienteIdUs)
                    .single();

                if (uErr) console.warn('[cargarConvs] Sin usuario para id_us:', pacienteIdUs, uErr);

                const nombre    = u?.us_nom || 'Paciente';
                const iniciales = nombre.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);

                convs.push({
                    id_conv:     row.id,
                    paciente_id: pacienteIdUs,
                    nombre,
                    iniciales,
                    fotoUrl:  u?.url_foto || null,
                    sinLeer:  count || 0,
                    ultimo: row.ultimo_mensaje
                        ? { msg_texto: row.ultimo_mensaje, msg_fecha: row.ultimo_mensaje_fecha }
                        : null
                });
            }

            console.log('[cargarConvs] ✅ Total convs válidas:', convs.length);
            todasConvs = convs;
            renderConvs(convs);
        }


        /* ═══════════════════════════════════════════════════════
           RENDERIZAR LA LISTA DE CONVERSACIONES EN EL SIDEBAR
        ═══════════════════════════════════════════════════════ */
        function renderConvs(lista) {
            const el      = document.getElementById('chatConvList');
            const loading = document.getElementById('chatConvLoading');
            if (loading) loading.style.display = 'none';
            el.innerHTML = '';

            if (!lista.length) {
                el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">Sin conversaciones aún</div>';
                return;
            }

            lista.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-conv-item' + (convActiva?.id_conv === c.id_conv ? ' active' : '');
                item.dataset.convId = c.id_conv;

                const hora    = chatFormatHora(c.ultimo?.msg_fecha);
                const preview = c.ultimo
                    ? c.ultimo.msg_texto.substring(0, 40) + (c.ultimo.msg_texto.length > 40 ? '…' : '')
                    : '';

                const avDiv = document.createElement('div');
                avDiv.className = 'chat-c-avatar md';
                if (c.fotoUrl) {
                    const img = document.createElement('img');
                    img.src   = c.fotoUrl;
                    img.alt   = c.nombre;
                    img.onerror = () => {
                        avDiv.innerHTML        = '';
                        avDiv.textContent      = c.iniciales;
                        avDiv.style.background = chatColorAvatar(c.iniciales);
                    };
                    avDiv.appendChild(img);
                } else {
                    avDiv.textContent      = c.iniciales;
                    avDiv.style.background = chatColorAvatar(c.iniciales);
                }

                item.innerHTML = `
                    <div class="chat-conv-info">
                        <div class="chat-conv-name">${chatEscHTML(c.nombre)}</div>
                        <div class="chat-conv-last">${chatEscHTML(preview)}</div>
                    </div>
                    <div class="chat-conv-meta">
                        <span class="chat-conv-time">${hora}</span>
                        ${c.sinLeer > 0 ? `<span class="chat-badge">${c.sinLeer}</span>` : ''}
                    </div>
                `;
                item.prepend(avDiv);
                item.addEventListener('click', () => abrirConv(c));
                el.appendChild(item);
            });
        }


        /* ═══════════════════════════════════════════════════════
           ABRIR UNA CONVERSACIÓN
        ═══════════════════════════════════════════════════════ */
        async function abrirConv(conv) {
            convActiva = conv;

            document.querySelectorAll('.chat-conv-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-conv-id="${conv.id_conv}"]`)?.classList.add('active');

            document.getElementById('chatEmptyState').style.display  = 'none';
            document.getElementById('chatActivePanel').style.display = 'flex';
            document.getElementById('chatHeaderName').textContent    = conv.nombre;

            const headerAv = document.getElementById('chatHeaderAvatar');
            headerAv.innerHTML = '';
            if (conv.fotoUrl) {
                const img = document.createElement('img');
                img.src   = conv.fotoUrl;
                img.alt   = conv.nombre;
                img.style.cssText = 'width:100%;height:100%;border-radius:50%;object-fit:cover;';
                img.onerror = () => {
                    headerAv.innerHTML        = '';
                    headerAv.textContent      = conv.iniciales;
                    headerAv.style.background = chatColorAvatar(conv.iniciales);
                };
                headerAv.appendChild(img);
                headerAv.style.background = 'transparent';
            } else {
                headerAv.textContent      = conv.iniciales;
                headerAv.style.background = chatColorAvatar(conv.iniciales);
            }

            document.getElementById('chatHeaderStatus').textContent = 'en línea';
            document.getElementById('chatMain').classList.remove('hide');
            document.getElementById('chatSidebar').classList.remove('show');

            await cargarMsgs(conv.id_conv);
            chatMarcarLeidos(conv.id_conv);

            const badge = document.querySelector(`[data-conv-id="${conv.id_conv}"] .chat-badge`);
            if (badge) badge.remove();
        }


        /* ═══════════════════════════════════════════════════════
           CARGAR MENSAJES DE UNA CONVERSACIÓN
        ═══════════════════════════════════════════════════════ */
        async function cargarMsgs(convId) {
            const area = document.getElementById('chatMessagesArea');

            area.innerHTML = `
                <div class="chat-skeleton" style="width:52%;align-self:flex-end;height:38px;margin:4px 0;"></div>
                <div class="chat-skeleton" style="width:44%;align-self:flex-start;height:38px;margin:4px 0;"></div>
            `;

            const { data, error } = await _sb
                .from('mensajes')
                .select('*')
                .eq('id_conv', convId)
                .order('msg_fecha', { ascending: true });

            area.innerHTML = '';

            if (error) { console.error(error); return; }

            if (!data.length) {
                area.innerHTML = '<div style="text-align:center;color:var(--chat-text-hint);font-size:13px;margin-top:40px;">Inicia la conversación 👋</div>';
                return;
            }

            let ultimaFechaSep = null;
            data.forEach(m => {
                const etiquetaFecha = chatFormatFechaSep(m.msg_fecha);
                if (etiquetaFecha !== ultimaFechaSep) {
                    const sep = document.createElement('div');
                    sep.className = 'chat-date-sep';
                    sep.innerHTML = `<span>${etiquetaFecha}</span>`;
                    area.appendChild(sep);
                    ultimaFechaSep = etiquetaFecha;
                }
                chatAgregarBubble(m, false);
            });

            chatScrollAbajo();
        }


        /* ═══════════════════════════════════════════════════════
           RENDERIZAR UNA BURBUJA DE MENSAJE
        ═══════════════════════════════════════════════════════ */
function renderConvs(lista) {
            const el      = document.getElementById('chatConvList');
            const loading = document.getElementById('chatConvLoading');
            if (loading) loading.style.display = 'none';
            el.innerHTML = '';
 
            if (!lista.length) {
                el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">Sin conversaciones aún</div>';
                return;
            }
 
            lista.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-conv-item' + (convActiva?.id_conv === c.id_conv ? ' active' : '');
                item.dataset.convId = c.id_conv;
 
                const hora    = chatFormatHora(c.ultimo?.msg_fecha);
                const preview = c.ultimo
                    ? c.ultimo.msg_texto.substring(0, 40) + (c.ultimo.msg_texto.length > 40 ? '…' : '')
                    : '';
 
                // ── Avatar ──────────────────────────────────────────────────
                const avDiv = document.createElement('div');
                avDiv.className = 'chat-c-avatar md';
                if (c.fotoUrl) {
                    const img = document.createElement('img');
                    img.src   = c.fotoUrl;
                    img.alt   = c.nombre;
                    img.onerror = () => {
                        avDiv.innerHTML        = '';
                        avDiv.textContent      = c.iniciales;
                        avDiv.style.background = chatColorAvatar(c.iniciales);
                    };
                    avDiv.appendChild(img);
                } else {
                    avDiv.textContent      = c.iniciales;
                    avDiv.style.background = chatColorAvatar(c.iniciales);
                }
 
                // ── Info ────────────────────────────────────────────────────
                const infoDiv = document.createElement('div');
                infoDiv.className = 'chat-conv-info';
                infoDiv.innerHTML = `
                    <div class="chat-conv-name">${chatEscHTML(c.nombre)}</div>
                    <div class="chat-conv-last">${chatEscHTML(preview)}</div>
                `;
 
                // ── Meta ────────────────────────────────────────────────────
                const metaDiv = document.createElement('div');
                metaDiv.className = 'chat-conv-meta';
                metaDiv.innerHTML = `
                    <span class="chat-conv-time">${hora}</span>
                    ${c.sinLeer > 0 ? `<span class="chat-badge">${c.sinLeer}</span>` : ''}
                `;
 
                // ✅ FIX: se construye todo con appendChild, nunca innerHTML
                //    así el avDiv con su <img> no se destruye
                item.appendChild(avDiv);
                item.appendChild(infoDiv);
                item.appendChild(metaDiv);
 
                item.addEventListener('click', () => abrirConv(c));
                el.appendChild(item);
            });
        }
 

        /* ═══════════════════════════════════════════════════════
           ENVIAR UN MENSAJE
           
           convActiva.id_conv es siempre el UUID real de Postgres
           (nunca 0000...) porque viene de _montarYAbrirConv().
        ═══════════════════════════════════════════════════════ */
        async function chatEnviarMensaje() {
            if (!FISIO_ID || !convActiva) {
                mostrarToastChat('Selecciona una conversación');
                return;
            }

            const input = document.getElementById('chatMsgInput');
            const texto = input.value.trim();
            if (!texto) return;

            // Guardia extra: el id_conv nunca debe ser el UUID cero
            if (!convActiva.id_conv || convActiva.id_conv === '00000000-0000-0000-0000-000000000000') {
                console.error('[chatEnviarMensaje] ❌ id_conv inválido:', convActiva.id_conv);
                mostrarToastChat('⚠️ Error de conversación, recarga la página');
                return;
            }

            input.value        = '';
            input.style.height = 'auto';

            const ahora = new Date().toISOString();

            // Burbuja optimista
            chatAgregarBubble({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_fecha: ahora,
                msg_leido: false,
                id_conv:   convActiva.id_conv
            }, true);
            chatScrollAbajo();

            const { error } = await _sb.from('mensajes').insert({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_leido: false,
                id_conv:   convActiva.id_conv   // ← UUID real, nunca 0000...
            });

            if (error) {
                console.error('[chatEnviarMensaje] Error:', error);
                mostrarToastChat('Error al enviar');
                return;
            }

            await _sb.from('conversaciones').update({
                ultimo_mensaje:       texto,
                ultimo_mensaje_fecha: ahora
            }).eq('id', convActiva.id_conv);
        }


        /* ═══════════════════════════════════════════════════════
           ESCUCHAR MENSAJES EN TIEMPO REAL
        ═══════════════════════════════════════════════════════ */
        function chatEscucharRT() {
            if (rtChannel) _sb.removeChannel(rtChannel);

            rtChannel = _sb.channel('motricare_chat_rt')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'mensajes' },
                    payload => {
                        const m = payload.new;
                        if (m.id_emisor === FISIO_ID) return;

                        if (convActiva && m.id_conv === convActiva.id_conv) {
                            chatAgregarBubble(m, true);
                            chatScrollAbajo();
                            chatMarcarLeidos(convActiva.id_conv);
                        } else {
                            mostrarToastChat('💬 Nuevo mensaje de un paciente');
                            cargarConvs();
                        }
                    }
                )
                .subscribe();
        }


        /* ═══════════════════════════════════════════════════════
           MARCAR MENSAJES COMO LEÍDOS
        ═══════════════════════════════════════════════════════ */
        async function chatMarcarLeidos(convId) {
            await _sb.from('mensajes')
                .update({ msg_leido: true })
                .eq('id_conv', convId)
                .neq('id_emisor', FISIO_ID);

            chatActualizarBadge();
        }


        /* ═══════════════════════════════════════════════════════
           FILTRAR CONVERSACIONES
        ═══════════════════════════════════════════════════════ */
        function filtrarConvs() {
            const q = document.getElementById('chatSearch').value.toLowerCase();
            renderConvs(todasConvs.filter(c => c.nombre.toLowerCase().includes(q)));
        }


        /* ═══════════════════════════════════════════════════════
           VOLVER AL SIDEBAR (móvil)
        ═══════════════════════════════════════════════════════ */
        function volverSidebarChat() {
            document.getElementById('chatSidebar').classList.add('show');
            document.getElementById('chatMain').classList.add('hide');
        }


        /* ═══════════════════════════════════════════════════════
           UTILIDADES
        ═══════════════════════════════════════════════════════ */
        function chatFormatFechaSep(fecha) {
            if (!fecha) return '';
            const TZ   = 'America/Mexico_City';
            const d    = new Date(fecha);
            const hoy  = new Date();
            const ayer = new Date();
            ayer.setDate(hoy.getDate() - 1);

            const opts    = { timeZone: TZ };
            const dStr    = d.toLocaleDateString('es-MX', opts);
            const hoyStr  = hoy.toLocaleDateString('es-MX', opts);
            const ayerStr = ayer.toLocaleDateString('es-MX', opts);

            if (dStr === hoyStr)  return 'Hoy';
            if (dStr === ayerStr) return 'Ayer';

            const diffDias = Math.floor((hoy - d) / (1000 * 60 * 60 * 24));
            if (diffDias < 7) return d.toLocaleDateString('es-MX', { weekday: 'long', timeZone: TZ });

            return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'long', year: 'numeric', timeZone: TZ });
        }

        function chatFormatHora(fecha) {
            if (!fecha) return '';
            const TZ     = 'America/Mexico_City';
            const d      = new Date(fecha);
            const hoyStr = new Date().toLocaleDateString('es-MX', { timeZone: TZ });
            const dStr   = d.toLocaleDateString('es-MX', { timeZone: TZ });

            if (dStr === hoyStr) {
                return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
            }
            return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', timeZone: TZ });
        }

        function chatScrollAbajo() {
            const area = document.getElementById('chatMessagesArea');
            requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
        }

        function chatAutoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 110) + 'px';
        }

        function chatHandleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatEnviarMensaje();
            }
        }

        function chatColorAvatar(ini) {
            const cols = ['#9b1b6e', '#7a1254', '#b5357f', '#c4629a', '#6d1249', '#d4539e', '#531040'];
            let s = 0;
            for (const c of (ini || 'P')) s += c.charCodeAt(0);
            return cols[s % cols.length];
        }

        function chatEscHTML(str) {
            return String(str || '')
                .replace(/&/g,  '&amp;')
                .replace(/</g,  '&lt;')
                .replace(/>/g,  '&gt;')
                .replace(/"/g,  '&quot;')
                .replace(/\n/g, '<br>');
        }

        function mostrarToastChat(msg) {
            const el = document.getElementById('chatToast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        window.toast = mostrarToastChat;

        /* ── PUNTO DE ENTRADA ── */
        chatInit();
    </script>
