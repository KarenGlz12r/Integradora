<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotriCare – Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./chat.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>
    <div id="navbar"></div>
    <main class="main-content">
        <div class="chat-toast" id="chatToast"></div>

        <!-- ══════════════════════════════════════════════════════
             SIDEBAR: lista de conversaciones con pacientes
        ══════════════════════════════════════════════════════ -->
        <aside class="chat-sidebar" id="chatSidebar">

            <div class="chat-sb-header">
                <div class="chat-sb-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <div class="chat-sb-title">Mensajes</div>
                    <div class="chat-sb-sub">Fisioterapeuta</div>
                </div>
            </div>

            <div class="chat-sb-search">
                <input type="text" placeholder="Buscar paciente..." id="chatSearch" oninput="filtrarConvs()">
            </div>

            <!-- Lista dinámica de conversaciones (se rellena desde JS) -->
            <div class="chat-conv-list" id="chatConvList">
                <div id="chatConvLoading"
                    style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">
                    Cargando conversaciones...
                </div>
            </div>

        </aside>

        <!-- ══════════════════════════════════════════════════════
             PANEL PRINCIPAL: mensajes de la conversación activa
        ══════════════════════════════════════════════════════ -->
        <main class="chat-main" id="chatMain">
            <div class="chat-bg-pattern"></div>

            <!-- Estado vacío: se muestra cuando ninguna conv está abierta -->
            <div class="chat-empty" id="chatEmptyState">
                <div class="chat-empty-icon">
                    <i class="fa-solid fa-message" style="font-size:28px;color:var(--color-primary);"></i>
                </div>
                <h2>MotriCare Chat</h2>
                <p>Selecciona un paciente para iniciar la conversación</p>
            </div>

            <!-- Panel activo: visible cuando hay una conversación abierta -->
            <div class="chat-active-panel" id="chatActivePanel" style="display:none;">

                <div class="chat-panel-header">
                    <!-- Botón "volver" visible solo en móvil -->
                    <button class="chat-icon-btn" id="chatBackBtn" style="display:none;" onclick="volverSidebarChat()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <!-- Avatar del paciente en el header (foto o iniciales) -->
                    <div class="chat-c-avatar hd" id="chatHeaderAvatar">P</div>
                    <div class="chat-panel-header-info">
                        <div class="chat-panel-name" id="chatHeaderName">Paciente</div>
                        <div class="chat-panel-status" id="chatHeaderStatus">en línea</div>
                    </div>
                    <button class="chat-icon-btn" title="Info del paciente"
                        onclick="mostrarToastChat('Perfil del paciente: próximamente')">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                </div>

                <!-- Área donde se renderizan las burbujas de mensajes -->
                <div class="chat-messages-area" id="chatMessagesArea"></div>

                <!-- Barra de escritura inferior -->
                <div class="chat-input-area">
                    <button class="chat-icon-btn" title="Adjuntar"
                        onclick="mostrarToastChat('Adjuntar archivos: próximamente')">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <div class="chat-input-wrap">
                        <textarea id="chatMsgInput" rows="1" placeholder="Escribe un mensaje..."
                            oninput="chatAutoResize(this)" onkeydown="chatHandleKey(event)"></textarea>
                    </div>
                    <button class="chat-send-btn" onclick="chatEnviarMensaje()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

            </div><!-- /chat-active-panel -->
        </main>
    </main>


    <!-- ══════════════════════════════════════════════════════
         Carga dinámica del Navbar
    ══════════════════════════════════════════════════════ -->
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src  = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>


    <!-- ══════════════════════════════════════════════════════
         LÓGICA PRINCIPAL DEL CHAT
    ══════════════════════════════════════════════════════ -->
    <script>
        /* ─────────────────────────────────────────────────────
           CONFIGURACIÓN DE SUPABASE
        ───────────────────────────────────────────────────── */
        const SUPABASE_URL = 'https://qhrennyqjhngysortocu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq';
        const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ─────────────────────────────────────────────────────
           VARIABLES GLOBALES DE SESIÓN
        ───────────────────────────────────────────────────── */
        let FISIO_ID      = null;  // auth.users.id → se usa como id_emisor en mensajes
        let FISIO_REAL_ID = null;  // fisioterapeutas.id → se usa en la tabla conversaciones
        let FISIO_FOTO    = null;  // URL de la foto de perfil del fisioterapeuta

        let convActiva = null;  // Objeto de la conversación actualmente abierta
        let todasConvs = [];    // Array con todas las conversaciones cargadas
        let rtChannel  = null;  // Canal de tiempo real de Supabase


        /* ═══════════════════════════════════════════════════════
           BADGE — HELPER CENTRALIZADO
           
           El Navbar.js expone window.recalcularBadgeGlobal() como
           la única función que toca el badge de la campana.
           
           El chat NUNCA modifica el badge directamente.
           Solo llama a este helper, que delega en el Navbar.
           Así se evita tener dos sistemas paralelos que se pisen.
        ═══════════════════════════════════════════════════════ */
        function chatActualizarBadge() {
            // Pequeño delay para que el UPDATE de msg_leido llegue a Supabase
            // antes de que el Navbar haga la query de recálculo
            setTimeout(() => {
                if (window.recalcularBadgeGlobal) window.recalcularBadgeGlobal();
            }, 300);
        }


        /* ═══════════════════════════════════════════════════════
           INICIALIZACIÓN
           Se llama al cargar la página. Obtiene la sesión,
           carga conversaciones y escucha mensajes en tiempo real.
        ═══════════════════════════════════════════════════════ */
        async function chatInit() {
            // Verificar sesión activa en Supabase Auth
            const { data: { user }, error } = await _sb.auth.getUser();
            if (error || !user) {
                mostrarToastChat('⚠️ Sin sesión activa');
                return;
            }
            FISIO_ID = user.id;

            // Obtener el ID interno del fisioterapeuta (tabla fisioterapeutas)
            // Es distinto del auth.users.id y se usa en la tabla conversaciones
            const { data: fisioRow } = await _sb
                .from('fisioterapeutas')
                .select('id')
                .eq('user_id', user.id)
                .single();

            if (!fisioRow) {
                mostrarToastChat('⚠️ Perfil de fisioterapeuta no encontrado');
                return;
            }
            FISIO_REAL_ID = fisioRow.id;

            // Cargar foto del fisioterapeuta desde la tabla perfiles
            const { data: perfil } = await _sb
                .from('perfiles')
                .select('foto_url')
                .eq('id', user.id)
                .single();
            if (perfil?.foto_url) FISIO_FOTO = perfil.foto_url;

            // Cargar lista de conversaciones en el sidebar
            await cargarConvs();

            // Activar escucha de mensajes nuevos en tiempo real
            chatEscucharRT();

            // Si venimos redirigidos desde la vista de Pacientes,
            // sessionStorage tiene el ID y nombre del paciente a abrir
            const pacienteIdPendiente     = sessionStorage.getItem('chatPacienteId');
            const pacienteNombrePendiente = sessionStorage.getItem('chatPacienteNombre');
            if (pacienteIdPendiente) {
                sessionStorage.removeItem('chatPacienteId');
                sessionStorage.removeItem('chatPacienteNombre');
                await abrirOCrearConvPaciente(pacienteIdPendiente, pacienteNombrePendiente);
            }
        }


        /* ═══════════════════════════════════════════════════════
           ABRIR O CREAR CONVERSACIÓN CON UN PACIENTE
           Usado cuando se llega desde la pantalla de Pacientes.
           1. Busca en tabla conversaciones
           2. Busca en mensajes existentes
           3. Si no existe, crea una conv nueva vacía
        ═══════════════════════════════════════════════════════ */
        async function abrirOCrearConvPaciente(pacienteUserId, pacienteNombre) {

            // Paso 1: buscar conversación existente entre este fisio y este paciente
            const { data: convExistente } = await _sb
                .from('conversaciones')
                .select('id')
                .eq('id_fisio', FISIO_REAL_ID)
                .eq('id_paciente', pacienteUserId)
                .maybeSingle();

            let convId = convExistente?.id;

            // Paso 2: si no hay registro en conversaciones, buscar en mensajes
            // (compatibilidad con chats anteriores al uso de la tabla conversaciones)
            if (!convId) {
                const { data: msgExistente } = await _sb
                    .from('mensajes')
                    .select('id_conv')
                    .eq('id_emisor', pacienteUserId)
                    .limit(1)
                    .maybeSingle();

                if (msgExistente?.id_conv) {
                    convId = msgExistente.id_conv;
                    // Registrar esta conv para que futuras búsquedas la encuentren
                    await _sb.from('conversaciones').upsert(
                        { id: convId, id_fisio: FISIO_REAL_ID, id_paciente: pacienteUserId },
                        { onConflict: 'id' }
                    );
                }
            }

            // Paso 3: si no existe nada, crear una conversación vacía nueva
            if (!convId) {
                const { data: nueva, error: errConv } = await _sb
                    .from('conversaciones')
                    .insert({ id_fisio: FISIO_REAL_ID, id_paciente: pacienteUserId })
                    .select('id')
                    .single();

                if (errConv) {
                    console.error('Error creando conversación:', errConv);
                    mostrarToastChat('Error al abrir chat');
                    return;
                }
                convId = nueva.id;
            }

            // Obtener datos del paciente para mostrar en el header
            const { data: u } = await _sb
                .from('usuario')
                .select('us_nom, url_foto')
                .eq('id_us', pacienteUserId)
                .single();

            const nombre    = u?.us_nom || pacienteNombre || 'Paciente';
            const iniciales = nombre.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
            const fotoUrl   = u?.url_foto || null;

            const conv = {
                id_conv:     convId,
                paciente_id: pacienteUserId,
                nombre,
                iniciales,
                fotoUrl,
                sinLeer: 0,
                ultimo: null
            };

            // Agregar al array local si no estaba ya
            const yaEsta = todasConvs.find(c => c.id_conv === convId);
            if (!yaEsta) todasConvs.unshift(conv);

            abrirConv(yaEsta || conv);
        }


        /* ═══════════════════════════════════════════════════════
           CARGAR TODAS LAS CONVERSACIONES DEL SIDEBAR
        ═══════════════════════════════════════════════════════ */
        async function cargarConvs() {
            const { data: convRows, error } = await _sb
                .from('conversaciones')
                .select('id, id_paciente, ultimo_mensaje, ultimo_mensaje_fecha')
                .eq('id_fisio', FISIO_REAL_ID)
                .order('ultimo_mensaje_fecha', { ascending: false });

            if (error) { console.error(error); return; }

            const convs = [];

            for (const row of (convRows || [])) {
                const pacienteId = row.id_paciente;
                let nombre = 'Paciente', iniciales = 'P', fotoUrl = null;

                // Contar mensajes no leídos de este paciente en esta conversación
                const { count } = await _sb
                    .from('mensajes')
                    .select('*', { count: 'exact', head: true })
                    .eq('id_conv', row.id)
                    .eq('msg_leido', false)
                    .neq('id_emisor', FISIO_ID);

                if (pacienteId) {
                    const { data: u } = await _sb
                        .from('usuario')
                        .select('us_nom, url_foto')
                        .eq('id_us', pacienteId)
                        .single();

                    if (u) {
                        nombre    = u.us_nom || 'Paciente';
                        iniciales = nombre.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                        fotoUrl   = u.url_foto || null;
                    }
                }

                convs.push({
                    id_conv:     row.id,
                    paciente_id: pacienteId,
                    nombre,
                    iniciales,
                    fotoUrl,
                    sinLeer: count || 0,
                    ultimo: row.ultimo_mensaje
                        ? { msg_texto: row.ultimo_mensaje, msg_fecha: row.ultimo_mensaje_fecha }
                        : null
                });
            }

            todasConvs = convs;
            renderConvs(convs);
        }


        /* ═══════════════════════════════════════════════════════
           RENDERIZAR LA LISTA DE CONVERSACIONES EN EL SIDEBAR
        ═══════════════════════════════════════════════════════ */
        function renderConvs(lista) {
            const el      = document.getElementById('chatConvList');
            const loading = document.getElementById('chatConvLoading');
            if (loading) loading.style.display = 'none';
            el.innerHTML = '';

            if (!lista.length) {
                el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">Sin conversaciones aún</div>';
                return;
            }

            lista.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-conv-item' + (convActiva?.id_conv === c.id_conv ? ' active' : '');
                item.dataset.convId = c.id_conv;

                const hora    = chatFormatHora(c.ultimo?.msg_fecha);
                const preview = c.ultimo
                    ? c.ultimo.msg_texto.substring(0, 40) + (c.ultimo.msg_texto.length > 40 ? '…' : '')
                    : '';

                const avDiv = document.createElement('div');
                avDiv.className = 'chat-c-avatar md';
                if (c.fotoUrl) {
                    const img = document.createElement('img');
                    img.src   = c.fotoUrl;
                    img.alt   = c.nombre;
                    img.onerror = () => {
                        avDiv.innerHTML        = '';
                        avDiv.textContent      = c.iniciales;
                        avDiv.style.background = chatColorAvatar(c.iniciales);
                    };
                    avDiv.appendChild(img);
                } else {
                    avDiv.textContent      = c.iniciales;
                    avDiv.style.background = chatColorAvatar(c.iniciales);
                }

                item.innerHTML = `
                    <div class="chat-conv-info">
                        <div class="chat-conv-name">${chatEscHTML(c.nombre)}</div>
                        <div class="chat-conv-last">${chatEscHTML(preview)}</div>
                    </div>
                    <div class="chat-conv-meta">
                        <span class="chat-conv-time">${hora}</span>
                        ${c.sinLeer > 0 ? `<span class="chat-badge">${c.sinLeer}</span>` : ''}
                    </div>
                `;
                item.prepend(avDiv);
                item.addEventListener('click', () => abrirConv(c));
                el.appendChild(item);
            });
        }


        /* ═══════════════════════════════════════════════════════
           ABRIR UNA CONVERSACIÓN
           Al abrir, se marcan los mensajes como leídos y se
           actualiza la campana del Navbar a través del helper.
        ═══════════════════════════════════════════════════════ */
        async function abrirConv(conv) {
            convActiva = conv;

            // Marcar item del sidebar como activo
            document.querySelectorAll('.chat-conv-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-conv-id="${conv.id_conv}"]`)?.classList.add('active');

            // Mostrar panel de mensajes
            document.getElementById('chatEmptyState').style.display  = 'none';
            document.getElementById('chatActivePanel').style.display = 'flex';

            document.getElementById('chatHeaderName').textContent = conv.nombre;

            // ── Header avatar ──
            const headerAv = document.getElementById('chatHeaderAvatar');
            headerAv.innerHTML = '';
            if (conv.fotoUrl) {
                const img = document.createElement('img');
                img.src   = conv.fotoUrl;
                img.alt   = conv.nombre;
                img.style.cssText = 'width:100%;height:100%;border-radius:50%;object-fit:cover;';
                img.onerror = () => {
                    headerAv.innerHTML        = '';
                    headerAv.textContent      = conv.iniciales;
                    headerAv.style.background = chatColorAvatar(conv.iniciales);
                };
                headerAv.appendChild(img);
                headerAv.style.background = 'transparent';
            } else {
                headerAv.textContent      = conv.iniciales;
                headerAv.style.background = chatColorAvatar(conv.iniciales);
            }

            document.getElementById('chatHeaderStatus').textContent = 'en línea';

            // En móvil: mostrar panel y ocultar sidebar
            document.getElementById('chatMain').classList.remove('hide');
            document.getElementById('chatSidebar').classList.remove('show');

            // Cargar mensajes y marcar como leídos
            // (chatMarcarLeidos también actualizará la campana del Navbar)
            await cargarMsgs(conv.id_conv);
            chatMarcarLeidos(conv.id_conv);

            // Quitar badge de no leídos del item en el sidebar
            const badge = document.querySelector(`[data-conv-id="${conv.id_conv}"] .chat-badge`);
            if (badge) badge.remove();
        }


        /* ═══════════════════════════════════════════════════════
           CARGAR MENSAJES DE UNA CONVERSACIÓN
           Muestra skeleton mientras carga, luego renderiza con
           separadores de fecha estilo WhatsApp.
        ═══════════════════════════════════════════════════════ */
        async function cargarMsgs(convId) {
            const area = document.getElementById('chatMessagesArea');

            // Skeleton de carga
            area.innerHTML = `
                <div class="chat-skeleton" style="width:52%;align-self:flex-end;height:38px;margin:4px 0;"></div>
                <div class="chat-skeleton" style="width:44%;align-self:flex-start;height:38px;margin:4px 0;"></div>
            `;

            const { data, error } = await _sb
                .from('mensajes')
                .select('*')
                .eq('id_conv', convId)
                .order('msg_fecha', { ascending: true });

            area.innerHTML = '';

            if (error) { console.error(error); return; }

            if (!data.length) {
                area.innerHTML = '<div style="text-align:center;color:var(--chat-text-hint);font-size:13px;margin-top:40px;">Inicia la conversación 👋</div>';
                return;
            }

            // Insertar separadores de fecha cuando cambia el día (estilo WhatsApp)
            let ultimaFechaSep = null;

            data.forEach(m => {
                const etiquetaFecha = chatFormatFechaSep(m.msg_fecha);

                if (etiquetaFecha !== ultimaFechaSep) {
                    const sep = document.createElement('div');
                    sep.className = 'chat-date-sep';
                    sep.innerHTML = `<span>${etiquetaFecha}</span>`;
                    area.appendChild(sep);
                    ultimaFechaSep = etiquetaFecha;
                }

                chatAgregarBubble(m, false);
            });

            chatScrollAbajo();
        }


        /* ═══════════════════════════════════════════════════════
           RENDERIZAR UNA BURBUJA DE MENSAJE
        ═══════════════════════════════════════════════════════ */
        function chatAgregarBubble(m, animar = true) {
            const area    = document.getElementById('chatMessagesArea');
            const esFisio = m.id_emisor === FISIO_ID;

            const row = document.createElement('div');
            row.className = 'chat-msg-row ' + (esFisio ? 'fisio' : 'paciente');
            if (animar) row.style.animation = 'chatFadeIn 0.2s ease';

            const hora = m.msg_fecha
                ? new Date(m.msg_fecha).toLocaleTimeString('es-MX', {
                    hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City'
                  })
                : '';

            const checkIcon = m.msg_leido
                ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/><polyline points="14 12 9 17"/></svg>`
                : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

            const avDiv   = document.createElement('div');
            avDiv.className = 'chat-msg-av';

            const fotoUrl = esFisio ? FISIO_FOTO : (convActiva?.fotoUrl || null);
            const ini     = esFisio ? 'Yo' : (convActiva?.iniciales || 'P');
            const bgColor = esFisio ? 'var(--color-primary)' : chatColorAvatar(convActiva?.iniciales || 'P');

            if (fotoUrl) {
                const img = document.createElement('img');
                img.src   = fotoUrl;
                img.alt   = ini;
                img.onerror = () => {
                    avDiv.innerHTML        = '';
                    avDiv.textContent      = ini;
                    avDiv.style.background = bgColor;
                };
                avDiv.appendChild(img);
            } else {
                avDiv.textContent      = ini;
                avDiv.style.background = bgColor;
            }

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble';
            bubble.innerHTML = `
                ${chatEscHTML(m.msg_texto)}
                <div class="chat-bubble-meta">
                    <span class="chat-bubble-time">${hora}</span>
                    ${esFisio ? `<span class="chat-check">${checkIcon}</span>` : ''}
                </div>
            `;

            row.appendChild(avDiv);
            row.appendChild(bubble);
            area.appendChild(row);
        }


        /* ═══════════════════════════════════════════════════════
           ENVIAR UN MENSAJE
        ═══════════════════════════════════════════════════════ */
        async function chatEnviarMensaje() {
            if (!FISIO_ID || !convActiva) {
                mostrarToastChat('Selecciona una conversación');
                return;
            }

            const input = document.getElementById('chatMsgInput');
            const texto = input.value.trim();
            if (!texto) return;

            input.value        = '';
            input.style.height = 'auto';

            const ahora = new Date().toISOString();

            // Mostrar burbuja optimista antes de confirmar la inserción
            chatAgregarBubble({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_fecha: ahora,
                msg_leido: false,
                id_conv:   convActiva.id_conv
            }, true);
            chatScrollAbajo();

            const { error } = await _sb.from('mensajes').insert({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_leido: false,
                id_conv:   convActiva.id_conv
            });

            if (error) {
                console.error(error);
                mostrarToastChat('Error al enviar');
                return;
            }

            // Actualizar último mensaje en tabla conversaciones para ordenar el sidebar
            await _sb.from('conversaciones').update({
                ultimo_mensaje:       texto,
                ultimo_mensaje_fecha: ahora
            }).eq('id', convActiva.id_conv);
        }


        /* ═══════════════════════════════════════════════════════
           ESCUCHAR MENSAJES EN TIEMPO REAL (Supabase Realtime)
           
           - Mensaje de la conv activa → renderizar + marcar leído
             (chatMarcarLeidos llama a chatActualizarBadge, que
              le avisa al Navbar para bajar la campana)
           
           - Mensaje de otra conv → toast + recargar sidebar
             (el Navbar.js ya lo detecta por su propio canal RT
              y sube la campana automáticamente)
        ═══════════════════════════════════════════════════════ */
        function chatEscucharRT() {
            if (rtChannel) _sb.removeChannel(rtChannel);

            rtChannel = _sb.channel('motricare_chat_rt')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'mensajes' },
                    payload => {
                        const m = payload.new;

                        // Ignorar mensajes propios (ya se muestran optimistamente)
                        if (m.id_emisor === FISIO_ID) return;

                        if (convActiva && m.id_conv === convActiva.id_conv) {
                            // Mensaje de la conv activa: mostrar y marcar leído de inmediato
                            // (el badge de la campana NO sube porque se lee al instante)
                            chatAgregarBubble(m, true);
                            chatScrollAbajo();
                            chatMarcarLeidos(convActiva.id_conv);
                        } else {
                            // Mensaje de otra conv: solo notificar y actualizar el sidebar
                            // El Navbar.js se encarga de subir la campana vía su canal RT
                            mostrarToastChat('💬 Nuevo mensaje de un paciente');
                            cargarConvs();
                        }
                    }
                )
                .subscribe();
        }


        /* ═══════════════════════════════════════════════════════
           MARCAR MENSAJES COMO LEÍDOS
           
           Actualiza msg_leido=true en Supabase y luego le avisa
           al Navbar para que recalcule y baje la campana.
           
           El Navbar.js escucha UPDATE en mensajes vía RT, pero
           chatActualizarBadge() lo llama de forma directa para
           que la bajada sea inmediata (sin esperar el evento RT).
        ═══════════════════════════════════════════════════════ */
        async function chatMarcarLeidos(convId) {
            await _sb.from('mensajes')
                .update({ msg_leido: true })
                .eq('id_conv', convId)
                .neq('id_emisor', FISIO_ID);

            // Avisar al Navbar para bajar la campana
            chatActualizarBadge();
        }


        /* ═══════════════════════════════════════════════════════
           FILTRAR CONVERSACIONES POR NOMBRE
        ═══════════════════════════════════════════════════════ */
        function filtrarConvs() {
            const q = document.getElementById('chatSearch').value.toLowerCase();
            renderConvs(todasConvs.filter(c => c.nombre.toLowerCase().includes(q)));
        }


        /* ═══════════════════════════════════════════════════════
           VOLVER AL SIDEBAR (móvil)
        ═══════════════════════════════════════════════════════ */
        function volverSidebarChat() {
            document.getElementById('chatSidebar').classList.add('show');
            document.getElementById('chatMain').classList.add('hide');
        }


        /* ═══════════════════════════════════════════════════════
           UTILIDADES
        ═══════════════════════════════════════════════════════ */

        /**
         * chatFormatFechaSep — Separador de fecha estilo WhatsApp
         * "Hoy" / "Ayer" / nombre del día (< 7 días) / fecha completa
         */
        function chatFormatFechaSep(fecha) {
            if (!fecha) return '';
            const TZ = 'America/Mexico_City';
            const d  = new Date(fecha);

            const hoy  = new Date();
            const ayer = new Date();
            ayer.setDate(hoy.getDate() - 1);

            const opts    = { timeZone: TZ };
            const dStr    = d.toLocaleDateString('es-MX', opts);
            const hoyStr  = hoy.toLocaleDateString('es-MX', opts);
            const ayerStr = ayer.toLocaleDateString('es-MX', opts);

            if (dStr === hoyStr)  return 'Hoy';
            if (dStr === ayerStr) return 'Ayer';

            // Si es de los últimos 7 días, mostrar nombre del día
            const diffDias = Math.floor((hoy - d) / (1000 * 60 * 60 * 24));
            if (diffDias < 7) {
                return d.toLocaleDateString('es-MX', { weekday: 'long', timeZone: TZ });
            }

            // Más antiguo: "08 de abril de 2026"
            return d.toLocaleDateString('es-MX', {
                day: '2-digit', month: 'long', year: 'numeric', timeZone: TZ
            });
        }

        /**
         * chatFormatHora — Para el sidebar
         * HH:MM si es hoy, DD/MM si es anterior
         */
        function chatFormatHora(fecha) {
            if (!fecha) return '';
            const TZ     = 'America/Mexico_City';
            const d      = new Date(fecha);
            const hoyStr = new Date().toLocaleDateString('es-MX', { timeZone: TZ });
            const dStr   = d.toLocaleDateString('es-MX', { timeZone: TZ });

            if (dStr === hoyStr) {
                return d.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit', timeZone: TZ });
            }
            return d.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', timeZone: TZ });
        }

        /** Scroll al fondo del área de mensajes */
        function chatScrollAbajo() {
            const area = document.getElementById('chatMessagesArea');
            requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
        }

        /** Ajusta altura del textarea al escribir (máx 110px) */
        function chatAutoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 110) + 'px';
        }

        /** Enter envía, Shift+Enter salta de línea */
        function chatHandleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatEnviarMensaje();
            }
        }

        /** Color determinista para avatares basado en iniciales */
        function chatColorAvatar(ini) {
            const cols = ['#9b1b6e', '#7a1254', '#b5357f', '#c4629a', '#6d1249', '#d4539e', '#531040'];
            let s = 0;
            for (const c of (ini || 'P')) s += c.charCodeAt(0);
            return cols[s % cols.length];
        }

        /** Escapa HTML para evitar XSS al insertar texto en el DOM */
        function chatEscHTML(str) {
            return String(str || '')
                .replace(/&/g,  '&amp;')
                .replace(/</g,  '&lt;')
                .replace(/>/g,  '&gt;')
                .replace(/"/g,  '&quot;')
                .replace(/\n/g, '<br>');
        }

        /** Toast temporal en la parte superior del chat */
        function mostrarToastChat(msg) {
            const el = document.getElementById('chatToast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        window.toast = mostrarToastChat;

        /* ── PUNTO DE ENTRADA ── */
        chatInit();
    </script>
