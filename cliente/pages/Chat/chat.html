<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotriCare – Chat</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* ══════════════════════════════════════
           VARIABLES — colores del sistema
        ══════════════════════════════════════ */
        :root {
            --color-primary:    #9b1b6e;
            --color-primary-dk: #7a1254;
            --color-primary-lt: #fce4f3;
            --color-hover:      #f7c9e8;
            --color-text-dark:  #3d0030;
            --color-border:     #e8a0d0;
            --color-white:      #ffffff;

            --chat-bubble-fisio: #f5d0ea;
            --chat-bubble-pac:   #ffffff;
            --chat-bg:           #fdf0f8;
            --chat-border:       var(--color-border);
            --chat-text:         #1a1a1a;
            --chat-text-sec:     #6b6b6b;
            --chat-text-hint:    #a0a0a0;
            --chat-input-bg:     #faf4f8;
            --chat-header-bg:    #ffffff;
        }

        /* ══════════════════════════════════════
           .main-content — Navbar.css ya pone
           margin-top:3.5rem y margin-left:4rem.
           Solo cambiamos flex-direction a row.
        ══════════════════════════════════════ */
        .main-content {
            flex-direction: row !important;
            padding: 0 !important;
            overflow: hidden;
        }

        /* ══════════════════════════════════════
           SIDEBAR DEL CHAT
        ══════════════════════════════════════ */
        .chat-sidebar {
            width: 300px;
            min-width: 240px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
            border-right: 1px solid var(--chat-border);
            height: 100%;
        }

        .chat-sb-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--chat-border);
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--color-primary-lt);
        }

        .chat-sb-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 15px;
            flex-shrink: 0;
        }

        .chat-sb-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--color-text-dark);
        }

        .chat-sb-sub {
            font-size: 11px;
            color: var(--color-primary);
            font-weight: 600;
        }

        .chat-sb-search {
            padding: 10px 14px;
            border-bottom: 1px solid var(--chat-border);
            background: #fff;
        }

        .chat-sb-search input {
            width: 100%;
            background: var(--chat-input-bg);
            border: 1px solid var(--chat-border);
            border-radius: 20px;
            padding: 7px 14px;
            font-size: 13px;
            font-family: inherit;
            color: var(--chat-text);
            outline: none;
            transition: border-color 0.15s;
        }

        .chat-sb-search input:focus { border-color: var(--color-primary); }
        .chat-sb-search input::placeholder { color: var(--chat-text-hint); }

        .chat-conv-list {
            flex: 1;
            overflow-y: auto;
        }

        .chat-conv-list::-webkit-scrollbar { width: 3px; }
        .chat-conv-list::-webkit-scrollbar-thumb { background: var(--chat-border); border-radius: 2px; }

        .chat-conv-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 11px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(232,160,208,0.3);
            transition: background 0.12s;
        }

        .chat-conv-item:hover { background: var(--color-primary-lt); }
        .chat-conv-item.active {
            background: var(--color-hover);
            border-left: 3px solid var(--color-primary);
        }

        .chat-c-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 800;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-c-avatar.md { width: 40px; height: 40px; font-size: 14px; }
        .chat-c-avatar.hd { width: 42px; height: 42px; font-size: 15px; }

        .chat-conv-info { flex: 1; min-width: 0; }

        .chat-conv-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--chat-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-conv-last {
            font-size: 12px;
            color: var(--chat-text-sec);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat-conv-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            flex-shrink: 0;
        }

        .chat-conv-time { font-size: 11px; color: var(--chat-text-hint); }

        .chat-badge {
            background: var(--color-primary);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            min-width: 18px;
            height: 18px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        /* ══════════════════════════════════════
           PANEL PRINCIPAL
        ══════════════════════════════════════ */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            position: relative;
            overflow: hidden;
            height: 100%;
        }

        .chat-bg-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='8' fill='%239b1b6e'/%3E%3C/svg%3E");
            background-size: 40px 40px;
            pointer-events: none;
        }

        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            z-index: 1;
        }

        .chat-empty-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: var(--color-primary-lt);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-empty h2 { font-size: 18px; font-weight: 800; color: var(--color-text-dark); }
        .chat-empty p  { font-size: 13px; color: var(--chat-text-sec); }

        .chat-active-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            z-index: 1;
            overflow: hidden;
        }

        .chat-panel-header {
            background: var(--chat-header-bg);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-bottom: 1px solid var(--chat-border);
            flex-shrink: 0;
        }

        .chat-panel-header-info { flex: 1; }

        .chat-panel-name   { font-size: 15px; font-weight: 700; color: var(--chat-text); }
        .chat-panel-status { font-size: 11px; color: var(--color-primary); font-weight: 600; }

        .chat-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 7px;
            border-radius: 50%;
            color: var(--chat-text-sec);
            display: flex;
            align-items: center;
            transition: background 0.15s;
            font-size: 15px;
        }

        .chat-icon-btn:hover {
            background: var(--color-primary-lt);
            color: var(--color-primary);
        }

        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .chat-messages-area::-webkit-scrollbar { width: 3px; }
        .chat-messages-area::-webkit-scrollbar-thumb { background: var(--chat-border); border-radius: 2px; }

        .chat-date-sep { text-align: center; margin: 10px 0; }

        .chat-date-sep span {
            background: rgba(155,27,110,0.1);
            font-size: 11px;
            color: var(--color-primary-dk);
            padding: 3px 12px;
            border-radius: 10px;
            font-weight: 600;
        }

        .chat-msg-row { display: flex; margin-bottom: 2px; }
        .chat-msg-row.fisio   { justify-content: flex-end; }
        .chat-msg-row.paciente{ justify-content: flex-start; }

        .chat-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .chat-msg-row.fisio .chat-bubble {
            background: var(--chat-bubble-fisio);
            border-bottom-right-radius: 3px;
            color: var(--color-text-dark);
        }

        .chat-msg-row.paciente .chat-bubble {
            background: var(--chat-bubble-pac);
            border-bottom-left-radius: 3px;
            color: var(--chat-text);
            box-shadow: 0 1px 2px rgba(155,27,110,0.08);
        }

        .chat-bubble-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 3px;
            margin-top: 3px;
        }

        .chat-bubble-time { font-size: 10px; color: var(--chat-text-hint); }
        .chat-check { display: flex; align-items: center; color: var(--color-primary); }

        .chat-input-area {
            background: var(--chat-header-bg);
            padding: 10px 14px;
            display: flex;
            align-items: flex-end;
            gap: 9px;
            border-top: 1px solid var(--chat-border);
            flex-shrink: 0;
        }

        .chat-input-wrap {
            flex: 1;
            background: var(--chat-input-bg);
            border-radius: 22px;
            border: 1px solid var(--chat-border);
            display: flex;
            align-items: flex-end;
            padding: 5px 14px;
            transition: border-color 0.15s;
        }

        .chat-input-wrap:focus-within { border-color: var(--color-primary); }

        .chat-input-wrap textarea {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 14px;
            color: var(--chat-text);
            resize: none;
            max-height: 110px;
            line-height: 1.5;
            padding: 4px 0;
        }

        .chat-input-wrap textarea::placeholder { color: var(--chat-text-hint); }

        .chat-send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--color-primary);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
            transition: background 0.15s, transform 0.1s;
        }

        .chat-send-btn:hover  { background: var(--color-primary-dk); }
        .chat-send-btn:active { transform: scale(0.94); }

        .chat-skeleton {
            background: linear-gradient(90deg, #f5d0ea 25%, #fce4f3 50%, #f5d0ea 75%);
            background-size: 200% 100%;
            animation: chatShimmer 1.2s infinite;
            border-radius: 10px;
        }

        @keyframes chatShimmer { to { background-position: -200% 0; } }
        @keyframes chatFadeIn  { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:none; } }

        .chat-toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(70px);
            background: var(--color-primary-dk);
            color: white;
            padding: 9px 20px;
            border-radius: 22px;
            font-size: 13px;
            font-family: inherit;
            transition: transform 0.28s;
            z-index: 9999;
        }

        .chat-toast.show { transform: translateX(-50%) translateY(0); }

        /* Responsive móvil */
        @media (max-width: 680px) {
            .main-content { margin-left: 0 !important; }
            .chat-sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                z-index: 10;
                width: 100%;
                display: none;
            }
            .chat-sidebar.show { display: flex; }
            .chat-main.hide { display: none; }
            #chatBackBtn { display: flex !important; }
        }
    </style>
</head>

<body>

    <div class="chat-toast" id="chatToast"></div>

    <!--
        .main-content es el mismo elemento que busca Navbar.js con:
            const mainContent = document.querySelector('.main-content');
        Por eso DEBE existir en el DOM antes de que corra Navbar.js.
        Navbar.css ya le aplica: margin-top:3.5rem, margin-left:4rem,
        height:calc(100vh - 3.5rem). Aquí solo lo ponemos en flex-row.
    -->
    <div class="main-content" id="mainContent">

        <!-- ── SIDEBAR DEL CHAT ── -->
        <aside class="chat-sidebar" id="chatSidebar">

            <div class="chat-sb-header">
                <div class="chat-sb-icon">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <div>
                    <div class="chat-sb-title">Mensajes</div>
                    <div class="chat-sb-sub">Fisioterapeuta</div>
                </div>
            </div>

            <div class="chat-sb-search">
                <input type="text" placeholder="Buscar paciente..." id="chatSearch" oninput="filtrarConvs()">
            </div>

            <div class="chat-conv-list" id="chatConvList">
                <div id="chatConvLoading"
                    style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">
                    Cargando conversaciones...
                </div>
            </div>

        </aside>

        <!-- ── PANEL PRINCIPAL ── -->
        <main class="chat-main" id="chatMain">
            <div class="chat-bg-pattern"></div>

            <!-- Estado vacío -->
            <div class="chat-empty" id="chatEmptyState">
                <div class="chat-empty-icon">
                    <i class="fa-solid fa-message" style="font-size:28px;color:var(--color-primary);"></i>
                </div>
                <h2>MotriCare Chat</h2>
                <p>Selecciona un paciente para iniciar la conversación</p>
            </div>

            <!-- Panel activo -->
            <div class="chat-active-panel" id="chatActivePanel" style="display:none;">

                <div class="chat-panel-header">
                    <button class="chat-icon-btn" id="chatBackBtn" style="display:none;" onclick="volverSidebarChat()">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <div class="chat-c-avatar hd" id="chatHeaderAvatar">P</div>
                    <div class="chat-panel-header-info">
                        <div class="chat-panel-name"   id="chatHeaderName">Paciente</div>
                        <div class="chat-panel-status" id="chatHeaderStatus">en línea</div>
                    </div>
                    <button class="chat-icon-btn" title="Info del paciente"
                        onclick="mostrarToastChat('Perfil del paciente: próximamente')">
                        <i class="fa-solid fa-circle-info"></i>
                    </button>
                </div>

                <div class="chat-messages-area" id="chatMessagesArea"></div>

                <div class="chat-input-area">
                    <button class="chat-icon-btn" title="Adjuntar"
                        onclick="mostrarToastChat('Adjuntar archivos: próximamente')">
                        <i class="fa-solid fa-paperclip"></i>
                    </button>
                    <div class="chat-input-wrap">
                        <textarea id="chatMsgInput" rows="1" placeholder="Escribe un mensaje..."
                            oninput="chatAutoResize(this)" onkeydown="chatHandleKey(event)"></textarea>
                    </div>
                    <button class="chat-send-btn" onclick="chatEnviarMensaje()">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

            </div><!-- fin chat-active-panel -->
        </main>

    </div><!-- fin .main-content -->

    <!--
        Navbar.js va DESPUÉS del .main-content para que
        document.querySelector('.main-content') no devuelva null.
    -->
       <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            })
    </script>

    <script>
        const SUPABASE_URL = 'https://qhrennyqjhngysortocu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq';
        const _sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let FISIO_ID   = null;
        let convActiva = null;
        let todasConvs = [];
        let rtChannel  = null;

        async function chatInit() {
            const { data: { user }, error } = await _sb.auth.getUser();
            if (error || !user) { mostrarToastChat('⚠️ Sin sesión activa'); return; }
            FISIO_ID = user.id;
            await cargarConvs();
            chatEscucharRT();
        }

        async function cargarConvs() {
            const { data, error } = await _sb
                .from('mensajes')
                .select('id_conv, id_emisor, msg_texto, msg_fecha, msg_leido')
                .order('msg_fecha', { ascending: false });

            if (error) { console.error(error); return; }

            const map = {};
            data.forEach(m => { if (!map[m.id_conv]) map[m.id_conv] = m; });

            const convs = [];
            for (const [convId, ultimo] of Object.entries(map)) {
                const pacienteId = ultimo.id_emisor !== FISIO_ID ? ultimo.id_emisor : null;
                let nombre = 'Paciente', iniciales = 'P', sinLeer = 0;

                const { count } = await _sb
                    .from('mensajes')
                    .select('*', { count: 'exact', head: true })
                    .eq('id_conv', convId)
                    .eq('msg_leido', false)
                    .neq('id_emisor', FISIO_ID);

                sinLeer = count || 0;

                if (pacienteId) {
                    const { data: u } = await _sb
                        .from('usuario')
                        .select('us_nom')
                        .eq('id_us', pacienteId)
                        .single();
                    if (u) {
                        nombre    = u.us_nom;
                        iniciales = nombre.split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                    }
                }

                convs.push({ id_conv: convId, paciente_id: pacienteId, nombre, iniciales, ultimo, sinLeer });
            }

            todasConvs = convs;
            renderConvs(convs);
        }

        function renderConvs(lista) {
            const el = document.getElementById('chatConvList');
            document.getElementById('chatConvLoading').style.display = 'none';
            el.innerHTML = '';

            if (!lista.length) {
                el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--chat-text-hint);font-size:13px;">Sin conversaciones aún</div>';
                return;
            }

            lista.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-conv-item' + (convActiva?.id_conv === c.id_conv ? ' active' : '');
                item.dataset.convId = c.id_conv;

                const hora    = chatFormatHora(c.ultimo?.msg_fecha);
                const preview = c.ultimo
                    ? c.ultimo.msg_texto.substring(0, 40) + (c.ultimo.msg_texto.length > 40 ? '…' : '')
                    : '';

                item.innerHTML = `
                    <div class="chat-c-avatar md" style="background:${chatColorAvatar(c.iniciales)}">${c.iniciales}</div>
                    <div class="chat-conv-info">
                        <div class="chat-conv-name">${chatEscHTML(c.nombre)}</div>
                        <div class="chat-conv-last">${chatEscHTML(preview)}</div>
                    </div>
                    <div class="chat-conv-meta">
                        <span class="chat-conv-time">${hora}</span>
                        ${c.sinLeer > 0 ? `<span class="chat-badge">${c.sinLeer}</span>` : ''}
                    </div>
                `;
                item.addEventListener('click', () => abrirConv(c));
                el.appendChild(item);
            });
        }

        async function abrirConv(conv) {
            convActiva = conv;

            document.querySelectorAll('.chat-conv-item').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-conv-id="${conv.id_conv}"]`)?.classList.add('active');

            document.getElementById('chatEmptyState').style.display  = 'none';
            document.getElementById('chatActivePanel').style.display = 'flex';

            document.getElementById('chatHeaderName').textContent        = conv.nombre;
            document.getElementById('chatHeaderAvatar').textContent      = conv.iniciales;
            document.getElementById('chatHeaderAvatar').style.background = chatColorAvatar(conv.iniciales);
            document.getElementById('chatHeaderStatus').textContent      = 'en línea';

            document.getElementById('chatMain').classList.remove('hide');
            document.getElementById('chatSidebar').classList.remove('show');

            await cargarMsgs(conv.id_conv);
            chatMarcarLeidos(conv.id_conv);

            const badge = document.querySelector(`[data-conv-id="${conv.id_conv}"] .chat-badge`);
            if (badge) badge.remove();
        }

        async function cargarMsgs(convId) {
            const area = document.getElementById('chatMessagesArea');
            area.innerHTML = `
                <div class="chat-skeleton" style="width:52%;align-self:flex-end;height:38px;margin:4px 0;"></div>
                <div class="chat-skeleton" style="width:44%;align-self:flex-start;height:38px;margin:4px 0;"></div>
            `;

            const { data, error } = await _sb
                .from('mensajes')
                .select('*')
                .eq('id_conv', convId)
                .order('msg_fecha', { ascending: true });

            area.innerHTML = '';

            if (error) { console.error(error); return; }
            if (!data.length) {
                area.innerHTML = '<div style="text-align:center;color:var(--chat-text-hint);font-size:13px;margin-top:40px;">Inicia la conversación 👋</div>';
                return;
            }

            let ultimaFecha = null;
            data.forEach(m => {
                const fechaStr = m.msg_fecha
                    ? new Date(m.msg_fecha).toLocaleDateString('es-MX', { day:'2-digit', month:'long', year:'numeric' })
                    : '';
                if (fechaStr !== ultimaFecha) {
                    const sep = document.createElement('div');
                    sep.className = 'chat-date-sep';
                    sep.innerHTML = `<span>${fechaStr}</span>`;
                    area.appendChild(sep);
                    ultimaFecha = fechaStr;
                }
                chatAgregarBubble(m, false);
            });

            chatScrollAbajo();
        }

        function chatAgregarBubble(m, animar = true) {
            const area    = document.getElementById('chatMessagesArea');
            const esFisio = m.id_emisor === FISIO_ID;

            const row = document.createElement('div');
            row.className = 'chat-msg-row ' + (esFisio ? 'fisio' : 'paciente');
            if (animar) row.style.animation = 'chatFadeIn 0.2s ease';

            const hora = m.msg_fecha
                ? new Date(m.msg_fecha).toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' })
                : '';

            const checkIcon = m.msg_leido
                ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/><polyline points="14 12 9 17"/></svg>`
                : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;

            row.innerHTML = `
                <div class="chat-bubble">
                    ${chatEscHTML(m.msg_texto)}
                    <div class="chat-bubble-meta">
                        <span class="chat-bubble-time">${hora}</span>
                        ${esFisio ? `<span class="chat-check">${checkIcon}</span>` : ''}
                    </div>
                </div>
            `;

            area.appendChild(row);
        }

        async function chatEnviarMensaje() {
            if (!FISIO_ID || !convActiva) { mostrarToastChat('Selecciona una conversación'); return; }

            const input = document.getElementById('chatMsgInput');
            const texto = input.value.trim();
            if (!texto) return;

            input.value = '';
            input.style.height = 'auto';

            chatAgregarBubble({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_fecha: new Date().toISOString(),
                msg_leido: false,
                id_conv:   convActiva.id_conv
            }, true);
            chatScrollAbajo();

            const { error } = await _sb.from('mensajes').insert({
                id_emisor: FISIO_ID,
                msg_texto: texto,
                msg_leido: false,
                id_conv:   convActiva.id_conv
            });

            if (error) { console.error(error); mostrarToastChat('Error al enviar'); }
        }

        function chatEscucharRT() {
            if (rtChannel) _sb.removeChannel(rtChannel);
            rtChannel = _sb.channel('motricare_chat_rt')
                .on('postgres_changes',
                    { event: 'INSERT', schema: 'public', table: 'mensajes' },
                    payload => {
                        const m = payload.new;
                        if (m.id_emisor === FISIO_ID) return;

                        if (convActiva && m.id_conv === convActiva.id_conv) {
                            chatAgregarBubble(m, true);
                            chatScrollAbajo();
                            chatMarcarLeidos(convActiva.id_conv);
                        } else {
                            mostrarToastChat('💬 Nuevo mensaje de un paciente');
                            cargarConvs();
                        }
                    }
                )
                .subscribe();
        }

        async function chatMarcarLeidos(convId) {
            await _sb.from('mensajes')
                .update({ msg_leido: true })
                .eq('id_conv', convId)
                .neq('id_emisor', FISIO_ID);
        }

        function filtrarConvs() {
            const q = document.getElementById('chatSearch').value.toLowerCase();
            renderConvs(todasConvs.filter(c => c.nombre.toLowerCase().includes(q)));
        }

        function chatScrollAbajo() {
            const area = document.getElementById('chatMessagesArea');
            requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
        }

        function chatAutoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 110) + 'px';
        }

        function chatHandleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); chatEnviarMensaje(); }
        }

        function volverSidebarChat() {
            document.getElementById('chatSidebar').classList.add('show');
            document.getElementById('chatMain').classList.add('hide');
        }

        function chatFormatHora(fecha) {
            if (!fecha) return '';
            const d   = new Date(fecha);
            const hoy = new Date();
            if (d.toDateString() === hoy.toDateString())
                return d.toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
            return d.toLocaleDateString('es-MX', { day:'2-digit', month:'2-digit' });
        }

        function chatColorAvatar(ini) {
            const cols = ['#9b1b6e','#7a1254','#b5357f','#c4629a','#6d1249','#d4539e','#531040'];
            let s = 0;
            for (const c of (ini || 'P')) s += c.charCodeAt(0);
            return cols[s % cols.length];
        }

        function chatEscHTML(str) {
            return String(str || '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
        }

        function mostrarToastChat(msg) {
            const el = document.getElementById('chatToast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        window.toast = mostrarToastChat;
        chatInit();
    </script>

</body>
</html>
