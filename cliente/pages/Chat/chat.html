<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./chat.css">
</head>
<body>
    <div id="navbar"></div>

    <main class="main-content">
        <div class="page-header">
            <div class="text">
                <i class="bi bi-chat-dots"></i>
                <p>Mensajes</p>
            </div>
        </div>

        <div id="talkjs-container" class="chat-container">

            <!-- Panel de usuarios conectados -->
            <div id="usuarios-panel">
                <p class="usuarios-titulo">
                    <i class="bi bi-people-fill"></i>
                    Conectados
                </p>
                <ul id="lista-usuarios"></ul>
            </div>

            <!-- Área principal -->
            <div class="chat-main">
                <div id="chat-titulo" class="chat-destinatario">
                    <i class="bi bi-chat-dots-fill"></i>
                    Canal general
                </div>

                <div id="mensajes" class="mensajes-lista"></div>

                <div id="typing-indicator" class="typing-indicator"></div>

                <!-- Barra de preview de archivo -->
                <div id="preview-bar" class="preview-bar" style="display:none;">
                    <i class="bi bi-paperclip"></i>
                    <span id="preview-nombre" class="preview-nombre"></span>
                    <button onclick="cancelarArchivo()" class="btn-cancelar-archivo">
                        <i class="bi bi-x"></i>
                    </button>
                </div>

                <!-- Input -->
                <div class="input-area">
                    <label class="btn-adjuntar" title="Adjuntar archivo">
                        <input type="file" id="file-input" style="display:none"
                            accept="image/*,.pdf,.txt,.doc,.docx,.zip"
                            onchange="archivoSeleccionado(this)" />
                        <i class="bi bi-paperclip fs-5"></i>
                    </label>
                    <textarea id="msg-input" class="msg-input"
                        placeholder="Escribe un mensaje..."
                        rows="1"
                        onkeydown="handleKey(event)"
                        oninput="autoResize(this); handleTyping()"></textarea>
                    <button id="btn-enviar" class="btn-enviar" onclick="enviarMensaje()">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script type="module" src="./chat.js"></script>
</body>
</html>
