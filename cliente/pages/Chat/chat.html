<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel MotriCare - Fisioterapeuta</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #fdf2f8;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #9b1b6e;
            color: white;
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }

        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 60%;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        .fisio {
            align-self: flex-end;
            background: #9b1b6e;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .paciente {
            align-self: flex-start;
            background: #f1f5f9;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        button {
            background: #9b1b6e;
            color: white;
            border: none;
            padding: 0 25px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #7a1556;
        }

        h2 {
            margin-top: 0;
            font-size: 1.2rem;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>MotriCare Chat</h2>
        <p>Sesión: Fisioterapeuta</p>
        <hr style="opacity: 0.3">
        <p style="font-size: 0.8rem;">Estado: <span id="status">Conectando...</span></p>
    </div>

    <div class="main-chat">
        <div id="chat-window"></div>
        <div class="input-area">
            <input type="text" id="mensajeInput" placeholder="Escribe un mensaje al paciente..." autocomplete="off">
            <button onclick="enviarMensaje()">Enviar</button>
        </div>
    </div>

    <script>
    // 1. CONFIGURACIÓN DE SUPABASE
    const SUPABASE_URL = 'https://qhrennyqjhngysortocu.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq'; // ⚠️ asegúrate que sea correcta
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let ID_FISIO = null;
    const chatWindow = document.getElementById('chat-window');

    // 2. INICIALIZACIÓN PRINCIPAL
    async function init() {
        const { data: { user }, error } = await _supabase.auth.getUser();

        if (error || !user) {
            console.error("Error de auth:", error);
            alert("No hay usuario autenticado");
            return;
        }

        ID_FISIO = user.id;

        await cargarHistorial();
        escucharTiempoReal();
    }

    // 3. DIBUJAR MENSAJES
    function dibujarMensaje(texto, emisorId) {
        const div = document.createElement('div');
        const clase = (emisorId === ID_FISIO) ? 'fisio' : 'paciente';
        div.className = 'msg ' + clase;
        div.innerText = texto;

        chatWindow.appendChild(div);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    // 4. CARGAR HISTORIAL
    async function cargarHistorial() {
        const { data, error } = await _supabase
            .from('mensajes')
            .select('*')
            .order('msg_fecha', { ascending: true });

        if (error) {
            console.error("Error cargando historial:", error);
            return;
        }

        chatWindow.innerHTML = "";

        data.forEach(m => {
            dibujarMensaje(m.msg_texto, m.id_emisor);
        });

        document.getElementById('status').innerText = 'En línea';
    }

    // 5. REALTIME
    function escucharTiempoReal() {
        _supabase.channel('chat_motricare')
            .on('postgres_changes',
                { event: 'INSERT', schema: 'public', table: 'mensajes' },
                payload => {
                    const nuevo = payload.new;

                    if (nuevo.id_emisor !== ID_FISIO) {
                        dibujarMensaje(nuevo.msg_texto, nuevo.id_emisor);
                    }
                }
            )
            .subscribe();
    }

    // 6. ENVIAR MENSAJE
    async function enviarMensaje() {
        if (!ID_FISIO) {
            alert("Usuario no cargado aún");
            return;
        }

        const input = document.getElementById('mensajeInput');
        const texto = input.value.trim();

        if (texto === "") return;

        const { error } = await _supabase.from('mensajes').insert({
            id_emisor: ID_FISIO,
            msg_texto: texto,
            msg_leido: false,
            id_conv: '00000000-0000-0000-0000-000000000000'
        });

        if (error) {
            console.error("Error completo:", error);
            alert("Error al enviar el mensaje.");
            return;
        }

        dibujarMensaje(texto, ID_FISIO);
        input.value = '';
    }

    // 7. ENTER PARA ENVIAR
    document.getElementById('mensajeInput').addEventListener("keypress", (e) => {
        if (e.key === "Enter") enviarMensaje();
    });

    // 8. INICIAR APP
    init();
</script>

</body>

</html>
