<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./ejercicios.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios</title>
</head>
<body>

    <div id="navbar"></div>
    <main class=" main-content">
                <div class="page-header">
            <div class="text">
                <p><i class="bi bi-list-check"></i> Gestion de ejercicios</p>
            </div>
            <div class="button">
                <a href="./crearRutinas.html" class="btn-registrar">
                    + Crear ejercicio
                </a>
            </div>
        </div>
        <!-- SECCIÓN DONDE SE MUESTRAN LOS EJERCICIOS -->
         <section id="videos-disponibles">
            <p id="noResult" style="display:none">No se encontraron ejercicios.</p>

         </section>

    </main>

        <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;

                <!-- CARGAMOS EL SCRIPT DESPUES DE QUE SE INYECTE EL HTML -->
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);

            })
    </script>
    <script type="module" src="./ejercicios.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    
</body>
</html>
