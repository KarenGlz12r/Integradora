<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Rutina</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./rutinas.css">
</head>
<body>

    <div id="navbar"></div>

    <main class="main-content">
        <div class="page-header">
            <div class="text">
                <p><i class="bi bi-list-check"></i> Gestión rutinas</p>
            </div>
            <div class="button">
                <a href="./rutinas.html" class="btn-registrar">
                    <i class="bi bi-arrow-left"></i> Ver rutinas
                </a>
            </div>
        </div>

        <form class="form" id="form-crear">

            <!-- Encabezado -->
            <div class="form-header">
                <div class="form-header-icon">
                    <i class="bi bi-plus-lg"></i>
                </div>
                <div>
                    <p class="title">Nueva rutina</p>
                    <p class="message">Completa los campos para registrar</p>
                </div>
            </div>

            <div id="alert-container"></div>

            <!-- Fila 1: Nombre + Zona -->
            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="rut_nom">Nombre de la rutina</label>
                    <input id="rut_nom" type="text" class="field-input" placeholder="Ej. Flexión de rodilla" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="rut_zona">Zona del cuerpo</label>
                    <select id="rut_zona" class="field-select" required>
                        <option value="">Seleccionar zona</option>
                        <option value="Brazo">Brazo</option>
                        <option value="Pierna">Pierna</option>
                        <option value="Mano">Mano</option>
                        <option value="Tobillo">Tobillo</option>
                        <option value="Hombro">Hombro</option>
                        <option value="Cadera">Cadera</option>
                    </select>
                </div>
            </div>

            <!-- Descripción -->
            <div class="field-group">
                <label class="field-label" for="rut_desc">Descripción</label>
                <textarea id="rut_desc" class="field-input field-textarea" placeholder="Describe en qué consiste la rutina..." required></textarea>
            </div>

            <!-- Fila 2: Objetivo + Visibilidad -->
            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="rut_objetivo">Objetivo</label>
                    <input id="rut_objetivo" type="text" class="field-input" placeholder="Ej. Fuerza, Flexibilidad" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="es_publica">Visibilidad</label>
                    <select id="es_publica" class="field-select" required>
                        <option value="">Seleccionar</option>
                        <option value="Pública">🌐 Pública</option>
                        <option value="Privada">🔒 Privada</option>
                    </select>
                </div>
            </div>

            <!-- URL imagen -->
            <div class="field-group">
                <label class="field-label" for="rut_img">URL de imagen</label>
                <input id="rut_img" type="url" class="field-input" placeholder="https://...">
            </div>

            <div class="separador-img">— o sube una imagen —</div>

            <!-- Upload -->
            <label for="rut_img_file" class="label-file">
                <input id="rut_img_file" type="file" accept="image/*" class="input-file">
                <i class="bi bi-cloud-arrow-up-fill"></i>
                <span>Arrastra o haz clic para subir</span>
            </label>

            <!-- Botones -->
            <div class="form-actions">
                <a href="./rutinas.html" class="btn-cancelar">Cancelar</a>
                <button type="button" class="submit" onclick="RegistrarRutinas()">
                    <i class="bi bi-check-lg"></i> Registrar rutina
                </button>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    <script type="module" src="./crearRutinas.js"></script>

</body>
</html>
