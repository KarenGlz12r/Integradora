<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./pacientes.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacientes</title>
</head>

<body>

    <div id="navbar"></div>
    <main class="main-content">
        <div class="text">
            <i class="bi bi-people"></i>
            <p>Mis pacientes</p>
        </div>

        <!-- ── TARJETAS DE ESTADÍSTICAS ── -->
        <section class="cards-info">
            <div class="card-stat" id="card-pacientes-confirmados">
                <div class="card-stat-icon">
                    <i class="bi bi-people-fill"></i>
                </div>
                <div class="card-stat-info">
                    <span class="card-stat-numero">...</span>
                    <span class="card-stat-label">Cargando...</span>
                </div>
            </div>

            <div class="card-stat" id="card-nuevos-mes">
                <div class="card-stat-icon" style="background:#e8f5e9; color:#2e7d32;">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <div class="card-stat-info">
                    <span class="card-stat-numero">...</span>
                    <span class="card-stat-label">Pacientes nuevos este mes</span>
                </div>
            </div>

            <div class="card-stat" id="card-pendientes-pago">
                <div class="card-stat-icon" style="background:#fff3e0; color:#e65100;">
                    <i class="bi bi-clock-history"></i>
                </div>
                <div class="card-stat-info">
                    <span class="card-stat-numero">...</span>
                    <span class="card-stat-label">Citas pendientes de pago</span>
                </div>
            </div>

            <div class="card-stat" id="card-proxima-cita">
                <div class="card-stat-icon" style="background:#e3f2fd; color:#1565c0;">
                    <i class="bi bi-calendar-event-fill"></i>
                </div>
                <div class="card-stat-info">
                    <span class="card-stat-numero">...</span>
                    <span class="card-stat-label">Próxima cita</span>
                </div>
            </div>
        </section>

        <div class="seccion-header">
            <h2 class="total-badge">Información de las citas</h2>
        </div>

        <!-- Lista de pacientes (se rellena desde JS) -->
        <section id="lista-pacientes" class="lista-pacientes"></section>
    </main>


    <!-- ══════════════════════════════════════════════════════════
         MODAL — ASIGNAR RUTINA A PACIENTE
         Se abre desde el botón "Asignar rutina" en cada tarjeta.
         Muestra solo rutinas que tienen al menos un ejercicio.
    ══════════════════════════════════════════════════════════ -->
    <div class="modal fade" id="modalAsignarRutina" tabindex="-1" aria-labelledby="modalAsignarRutinaLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="modalAsignarRutinaLabel">
                        <i class="bi bi-list-check"></i> Asignar rutina
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <!-- Nombre del paciente seleccionado (se llena dinámicamente) -->
                    <p class="mb-3">
                        Paciente: <strong id="modalAsignarNombrePaciente">—</strong>
                    </p>

                    <label class="form-label" for="selectRutinaAsignar">
                        Selecciona una rutina con ejercicios:
                    </label>

                    <!-- Select con rutinas disponibles (solo las que tienen ejercicios) -->
                    <select class="form-select" id="selectRutinaAsignar">
                        <option value="">Cargando rutinas...</option>
                    </select>

                    <!-- Aviso si no hay rutinas con ejercicios -->
                    <p id="avisoSinRutinas" class="text-warning mt-2" style="display:none; font-size:13px;">
                        <i class="bi bi-exclamation-triangle"></i>
                        No tienes rutinas con ejercicios. Crea una rutina y agrégale ejercicios primero.
                    </p>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnConfirmarAsignarRutina">
                        <i class="bi bi-person-check"></i> Asignar
                    </button>
                </div>

            </div>
        </div>
    </div>


    <!-- ── CARGA DEL NAVBAR ── -->
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-u1OknCvxWvY5kfmNBILK2hRnQC3Pr17a+RTT6rIHI7NnikvbZlHgTPOOmMi466C8"
        crossorigin="anonymous"></script>

    <script src="./pacientes.js" type="module"></script>
</body>

</html>
