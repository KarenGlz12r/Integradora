<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./agenda.css">
    <title>Agenda</title>
</head>

<body>
    <div id="navbar"></div>
    <main class="main-content">
        <div class="page-header">
            <div class="text">
                <i class="bi bi-calendar3"></i>
                <p>Mi agenda</p>
            </div>
        </div>
        <!-- CALENDARIO -->
        <div class="agenda-wrapper">
            <div id="calendario"></div>
        </div>
        <!-- MODAL DETALLE CITA -->
        <div class="modal fade" id="modalCita" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-calendar-event"></i>
                            Detalle de cita
                        </h5>
                        <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="detalle-cita">
                            <div class="detalle-fila">
                                <i class="bi bi-person-fill"></i>
                                <span id="det-paciente"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class="bi bi-clipboard2-pulse"></i>
                                <span id="det-motivo"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class=" bi bi-clock"></i>
                                <span id="det-horario"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class="bi bi-circle-fill" id="det-estado-icon"></i>
                                <span id="det-estado"></span>
                            </div>
                            <div class="detalle-fila" id="det-notas-fila">
                                <i class="bi bi-journal-text"></i>
                                <span id="det-notas"></span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn-secondary btn" data-bs-dismiss="modal">Cerrar</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./agenda.js"></script>
</body>

</html>
