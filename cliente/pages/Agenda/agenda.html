<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- FullCalendar -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="./agenda.css">
    <title>Agenda</title>
</head>

<body>
    <div id="navbar"></div>
    <main class="main-content">
        <div class="page-header">
            <div class="text">
                <i class="bi bi-calendar3"></i>
                <p>Mi agenda</p>
            </div>
        </div>
        <!-- CALENDARIO -->
        <div class="agenda-wrapper">
            <div id="calendario"></div>
        </div>
        <!-- MODAL DETALLE CITA -->
        <!-- MODAL DETALLE CITA -->
        <div class="modal fade" id="modalCita" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="bi bi-calendar-event"></i>
                            Detalle de cita
                        </h5>
                        <button class="btn-close" type="button" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="detalle-cita">
                            <div class="detalle-fila">
                                <i class="bi bi-person-fill"></i>
                                <span id="det-paciente"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class="bi bi-clipboard2-pulse"></i>
                                <span id="det-motivo"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class="bi bi-clock"></i>
                                <span id="det-horario"></span>
                            </div>
                            <div class="detalle-fila">
                                <i class="bi bi-circle-fill" id="det-estado-icon"></i>
                                <span id="det-estado"></span>
                            </div>
                            <!-- CAMBIAR FECHA Y HORA -->
                            <div class="detalle-fila align-items-center mt-2">
                                <i class="bi bi-calendar3" style="color:#9b1b6e;"></i>
                                <div class="d-flex align-items-center gap-2 w-100">
                                    <label class="fw-semibold mb-0"
                                        style="color:#6e1068; white-space:nowrap;">Fecha:</label>
                                    <input type="date" id="input-fecha" class="form-control form-control-sm">
                                </div>
                            </div>

                            <div class="detalle-fila align-items-center mt-2">
                                <i class="bi bi-clock" style="color:#9b1b6e;"></i>
                                <div class="d-flex gap-2 w-100 align-items-center">
                                    <label class="fw-semibold mb-0"
                                        style="color:#6e1068; white-space:nowrap;">Hora:</label>
                                    <input type="time" id="input-hora-inicio" class="form-control form-control-sm">
                                    <span style="color:#6e1068;">—</span>
                                    <input type="time" id="input-hora-fin" class="form-control form-control-sm">
                                </div>
                            </div>
                            <!-- SEPARADOR -->
                            <hr style="border-color: #e8a0d0; margin: 1rem 0;">

                            <!-- CAMBIAR ESTADO -->
                            <div class="detalle-fila align-items-center">
                                <i class="bi bi-arrow-repeat" style="color:#9b1b6e;"></i>
                                <div class="d-flex align-items-center gap-2 w-100">
                                    <label class="fw-semibold mb-0" style="color:#6e1068; white-space:nowrap;">
                                        Estado:
                                    </label>
                                    <select id="select-estado" class="form-select form-select-sm">
                                        <option value="pendiente_pago">Pendiente pago</option>
                                        <option value="confirmada">Confirmada</option>
                                        <option value="completada">Completada</option>
                                        <option value="no_asistio">No asistió</option>
                                        <option value="cancelada">Cancelada</option>
                                    </select>
                                </div>
                            </div>

                            <!-- NOTAS DEL FISIO -->
                            <div class="detalle-fila align-items-start mt-2">
                                <i class="bi bi-pencil-square" style="color:#9b1b6e; margin-top:6px;"></i>
                                <div class="d-flex flex-column gap-1 w-100">
                                    <label class="fw-semibold mb-0" style="color:#6e1068;">
                                        Notas del fisio:
                                    </label>
                                    <textarea id="input-notas" class="form-control form-control-sm" rows="3"
                                        placeholder="Escribe tus notas aquí...">
                            </textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                        <button id="btn-guardar-estado" class="btn" style="background:#9b1b6e; color:white;">
                            <i class="bi bi-floppy"></i> Guardar
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./agenda.js"></script>
</body>

</html>
