<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

</head>

<body>
    <header>
        <div class="left">
            <div class="menu-container">
                <div class="menu" id="menu">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div class="right">
            <!-- CAMPANA DE NOTIFICACIONES -->
            <a href="/cliente/pages/Chat/chat.html" class="bell-btn" id="bell-btn" title="Mensajes">
                <i class="fa-solid fa-bell"></i>
                <span class="bell-badge" id="bell-badge" style="display:none;">0</span>
            </a>
            <!-- DROPDOWN -->
            <div class="user-menu">

                <div class="user-avatar" onclick="toggleDropdown()">
                    <img src="/cliente/icons/user-svgrepo-com.svg" alt="" id="user-foto">
                </div>
                <div class="dropdown" id="dropdown">
                    <ul>
                        <li onclick="abrirSelectorFoto()">
                            <img src="/cliente/icons/user-svgrepo-com.svg" alt="">
                            <span>Editar foto de perfil</span>
                        </li>
                        <li onclick="cerrarSesion()">
                            <img src="/cliente/icons/logout-svgrepo-com.svg" alt="">
                            <span>Cerrar sesión</span>
                        </li>
                    </ul>
                </div>
                <input type="file" name="" id="input-foto" accept="image/*" style="display: none;"
                    onchange="subirFoto(event)">
            </div>
        </div>
    </header>
    <div class="sidebar" id="sidebar">
        <nav>
            <div class="sidebar-logo">
                <img src="/cliente/images/Logo2-Motricare.jpeg" alt="icon-motricare" class="logo">
            </div>
            <ul>
                <li>

                    <a href="/cliente/dashboard.html" class="selected">
                    <i class="fa-solid fa-house"></i>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/pacientes/pacientes.html">
                      <i class="fa-solid fa-users"></i>
                        <span>Pacientes</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/rutinas/rutinas.html">
                     <i class="fa-solid fa-folder"></i>
                        <span>Rutinas</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/ejercicios/ejercicios.html">
                    <i class="fa-solid fa-video"></i>
                        <span>Ejercicios</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                    <i class="fa-solid fa-chart-line"></i>
                        <span>Seguimiento</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/Agenda/agenda.html">
                       <i class="fa-solid fa-calendar"></i>
                           <span>Agenda</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/Chat/chat.html">
                        <i class="fa-solid fa-message"></i>
                        <span>Mensajes</span>
                    </a>
                </li>
                <li>
                    <a href="/cliente/pages/ganancias/ganancias.html">
                    <i class="fa-solid fa-money-bill"></i>
                        <span>Ingresos</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>
    <script type="module" src="Navbar.js"></script>

</body>

</html>
