<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crear contraseña</title>
</head>
<body>

<h2>Crear nueva contraseña</h2>

<input type="password" id="password" placeholder="Nueva contraseña">
<button onclick="actualizarPassword()">Guardar</button>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://qhrennyqjhngysortocu.supabase.co",
  "sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq"
);

// 🔐 Detectar sesión desde el link
supabase.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    console.log("Sesión válida para recuperación");
  }
});

async function actualizarPassword() {
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.updateUser({
    password
  });

  if (error) {
    alert(error.message);
  } else {
    alert("Contraseña creada correctamente");
    window.location.href = "/login.html";
  }
}

window.actualizarPassword = actualizarPassword;
</script>

</body>
</html>
