<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
</head>

<body>
    <div class="background-noise"></div>
    <div>
        <img src="./assets/logo-motricaree.png" alt="Logo de Motricare, clínica de fisioterapia" class="logo-nav">
    </div>
    <h1 class="titulo">Motricare</h1>
    <div class="container">
        <div class="heading">Inicio de sesión</div>
        <div id="alert-container"></div>
        <form action="" class="form">
            <input required="" class="input" type="email" name="email" id="emailLogin" placeholder="Correo electronico">
            <input required="" class="input" type="password" name="password" id="password" placeholder="Contraseña">
            <span class="forgot-password"><a href="#">¿Olvidó su contraseña?</a></span>
            <button class="login-button" onclick="login()" type="button">Iniciar sesión</button>

        </form>

    </div>

    <script type="module">
        import {
            login
        } from "./auth.js";
        window.login = login;
    </script>
    <script type="module">
        import {redirigirSesionActiva} from "./proteger.js";
        await redirigirSesionActiva();


    </script>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
