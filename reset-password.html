<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña — Motricare</title>
    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

    
</head>
<body>

    <!-- Logo -->
    <div class="logo-wrap">
        <img src="./assets/Logo2-Motricare.jpeg" alt="Logo Motricare">
        <h1>Motricare</h1>
    </div>

    <!-- Card -->
    <div class="card">

        <!-- Formulario -->
        <div id="form-wrap">
            <p class="card-title">Nueva contraseña</p>
            <p class="card-subtitle">Elige una contraseña segura para tu cuenta.</p>

            <div id="alert-reset"></div>

            <div class="input-group-custom">
                <label for="nuevaPass">Nueva contraseña</label>
                <input type="password" id="nuevaPass" placeholder="••••••••" autocomplete="new-password">
                <span class="toggle-pass" data-target="nuevaPass">👁</span>
            </div>

            <div class="input-group-custom">
                <label for="confirmarPass">Confirmar contraseña</label>
                <input type="password" id="confirmarPass" placeholder="••••••••" autocomplete="new-password">
                <span class="toggle-pass" data-target="confirmarPass">👁</span>
            </div>

            <!-- Requisitos -->
            <div class="requisitos">
                <p>La contraseña debe tener:</p>
                <div class="req-item" id="req-len">
                    <div class="dot"></div> Al menos 8 caracteres
                </div>
                <div class="req-item" id="req-upper">
                    <div class="dot"></div> Una letra mayúscula
                </div>
                <div class="req-item" id="req-num">
                    <div class="dot"></div> Un número
                </div>
            </div>

            <button class="btn-primary-custom" id="btnReset" disabled>
                Guardar contraseña
            </button>
        </div>

        <!-- Estado éxito -->
        <div class="estado-exito" id="estado-exito">
            <div class="check-circle"><i class="bi bi-check-circle" style="color: green;"></i></div>
            <h3>¡Contraseña actualizada!</h3>
            <p>Tu contraseña ha sido cambiada exitosamente. Ya puedes iniciar sesión.</p>
            <button class="btn-primary-custom" onclick="window.location.href='/index.html'">
                Ir al inicio de sesión
            </button>
        </div>

    </div>

    <!-- Volver -->
    <p class="volver" id="link-volver">
        ¿Recordaste tu contraseña? <a href="/index.html">Inicia sesión</a>
    </p>

    <script type="module">
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";


        const supabase = createClient(
            "https://qhrennyqjhngysortocu.supabase.co",   
            "sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq"           
        );

        // ── Refs ─────────────────────────────────────────────────
        const nuevaPass     = document.getElementById("nuevaPass");
        const confirmarPass = document.getElementById("confirmarPass");
        const btnReset      = document.getElementById("btnReset");
        const alertReset    = document.getElementById("alert-reset");

        // ── Toggle mostrar/ocultar contraseña ────────────────────
        document.querySelectorAll(".toggle-pass").forEach(btn => {
            btn.addEventListener("click", () => {
                const input = document.getElementById(btn.dataset.target);
                input.type = input.type === "password" ? "text" : "password";
                btn.textContent = input.type === "password" ? "👁" : "🙈";
            });
        });

        // ── Validación en tiempo real ─────────────────────────────
        function validar(valor) {
            return {
                len:   valor.length >= 8,
                upper: /[A-Z]/.test(valor),
                num:   /[0-9]/.test(valor),
            };
        }

        function actualizarRequisitos(valor) {
            const v = validar(valor);
            document.getElementById("req-len").classList.toggle("ok", v.len);
            document.getElementById("req-upper").classList.toggle("ok", v.upper);
            document.getElementById("req-num").classList.toggle("ok", v.num);

            const coincide = confirmarPass.value === valor && valor.length > 0;
            const todo = v.len && v.upper && v.num && coincide;
            btnReset.disabled = !todo;
        }

        nuevaPass.addEventListener("input", () => actualizarRequisitos(nuevaPass.value));
        confirmarPass.addEventListener("input", () => actualizarRequisitos(nuevaPass.value));

        // ── Helpers UI ────────────────────────────────────────────
        function mostrarAlerta(tipo, msg) {
            alertReset.innerHTML = `
                <div class="alerta ${tipo}">
                    <span>${tipo === "danger" ? "⚠️" : "✅"}</span>
                    <span>${msg}</span>
                </div>`;
        }

        // ── Guardar nueva contraseña ──────────────────────────────
        btnReset.addEventListener("click", async () => {
            alertReset.innerHTML = "";
            const pass = nuevaPass.value;

            if (pass !== confirmarPass.value) {
                mostrarAlerta("danger", "Las contraseñas no coinciden.");
                return;
            }

            btnReset.disabled = true;
            btnReset.textContent = "Guardando...";

            const { error } = await supabase.auth.updateUser({ password: pass });

            if (error) {
                mostrarAlerta("danger", `Error: ${error.message}`);
                btnReset.disabled = false;
                btnReset.textContent = "Guardar contraseña";
                return;
            }

            // Éxito
            document.getElementById("form-wrap").style.display = "none";
            document.getElementById("link-volver").style.display = "none";
            document.getElementById("estado-exito").style.display = "block";
        });

        // ── Verificar que hay sesión de recuperación activa ───────
        // Supabase pone los tokens en el hash de la URL al redirigir
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) {
            mostrarAlerta("danger", "El enlace ha expirado o no es válido. Solicita uno nuevo.");
            btnReset.disabled = true;
        }
    </script>

</body>
</html>
