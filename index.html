<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión — Motricare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="global.css">
</head>

<body>
    <div class="background-noise"></div>

    <div style="text-align:center; padding-top: 32px; position: relative; z-index: 2;">
        <img src="./assets/Logo2-Motricare.jpeg" alt="Logo Motricare" class="logo-nav"
            style="width:80px; height:80px; border-radius:50%; object-fit:cover;">
    </div>

    <h1 class="titulo" style="position:relative; z-index:2;">Motricare</h1>

    <div class="container" style="position:relative; z-index:2;">
        <div class="heading">Inicio de sesión</div>

        <!-- Mensajes de error -->
        <div id="alert-container"></div>

        <!-- Formulario -->
        <div class="form">
            <input class="input" type="email" id="emailLogin" placeholder="Correo electrónico" autocomplete="email">
            <input class="input" type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
            <br>
            <span class="forgot-password">
                <a href="" data-ba-toggle="modal" data-bs-target="#modalRecuperar">
                    ¿Olvidó su contraseña?
                </a>
            </span>
            <button class="login-button" id="btnLogin" type="button">Iniciar sesión</button>
        </div>
    </div>
    <!-- Modal recuperar contraseña -->
    <div class="modal fade" id="modalRecuperar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">Recuperar contraseña</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-secondary small">
                        Ingresa tu correo y te enviaremos un enlace para restablecer tu contraseña.
                    </p>
                    <div id="alert-recuperar"></div>
                    <input class="input" type="email" id="emailRecuperar" placeholder="Correo electrónico"
                        autocomplete="email">
                </div>
                <div class="modal-footer border-secondary">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="login-button" id="btnRecuperar" style="width:auto; padding: 8px 20px;">
                        Enviar enlace
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script de login — separado del resto para mayor claridad -->
    <script type="module">
        import { login, apiFetch, obtenerToken } from "./auth.js";

        const btn = document.getElementById("btnLogin");
        const alertContainer = document.getElementById("alert-container");

        // ── Helpers UI ───────────────────────────────────────────
        function setLoading(texto) {
            btn.disabled = true;
            btn.textContent = texto;
        }

        function setReady() {
            btn.disabled = false;
            btn.textContent = "Iniciar sesión";
        }

        function mostrarError(msg) {
            alertContainer.innerHTML = `
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    ${msg}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>`;
        }

        // ── 1. Verificar si ya hay sesión activa ─────────────────
        // Si hay token guardado, verificarlo con el backend.
        // Si es válido, redirigir directo al dashboard.
        const tokenGuardado = obtenerToken();

        if (tokenGuardado) {
            setLoading("Verificando...");
            try {
                const sesion = await apiFetch("/api/auth/me");
                if (sesion?.ok) {
                    // Sesión válida → redirigir
                    if (sesion.rol === "admin") {
                        window.location.href = "/admin/dashboard.html";
                    } else if (sesion.rol === "fisioterapeuta") {
                        window.location.href = "/cliente/dashboard.html";
                    } else {
                        setReady();
                    }
                } else {
                    // Token inválido o expirado → limpiar y mostrar login normal
                    setReady();
                }
            } catch (e) {
                console.error("Error verificando sesión:", e);
                setReady();
            }
        }
        // Sin token → botón ya está listo por defecto (no deshabilitar)

        // ── 2. Click en el botón ─────────────────────────────────
        btn.addEventListener("click", async () => {
            const email = document.getElementById("emailLogin").value.trim();
            const password = document.getElementById("password").value;

            alertContainer.innerHTML = "";

            if (!email || !password) {
                mostrarError("Por favor ingresa tu correo y contraseña.");
                return;
            }

            setLoading("Entrando...");

            try {
                await login();
                // Si login() no redirige (error de rol u otro), reactivar botón
            } catch (e) {
                console.error("Error en login:", e);
                mostrarError("Ocurrió un error inesperado. Intenta de nuevo.");
            } finally {
                setReady();
            }
        });

        // ── 3. Permitir Enter en los campos ──────────────────────
        document.getElementById("password").addEventListener("keydown", (e) => {
            if (e.key === "Enter") btn.click();
        });
        document.getElementById("emailLogin").addEventListener("keydown", (e) => {
            if (e.key === "Enter") btn.click();
        });

        // ── 4. Recuperar contraseña ──────────────────────────────
        import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

        const supabase = createClient(
            "https://qhrennyqjhngysortocu.supabase.co",   
            "sb_publishable_AQ7Wi7CXWGjC5w1qeK1qMg_rk5A8dsq"                   
        );

        const btnRecuperar = document.getElementById("btnRecuperar");
        const alertRecuperar = document.getElementById("alert-recuperar");

        btnRecuperar.addEventListener("click", async () => {
            const email = document.getElementById("emailRecuperar").value.trim();
            alertRecuperar.innerHTML = "";

            if (!email) {
                alertRecuperar.innerHTML = `
            <div class="alert alert-warning">Ingresa tu correo electrónico.</div>`;
                return;
            }

            btnRecuperar.disabled = true;
            btnRecuperar.textContent = "Enviando...";

            const { error } = await supabase.auth.resetPasswordForEmail(email, {
                redirectTo: "https://motricare.vercel.app/reset-password.html" 
            });

            if (error) {
                alertRecuperar.innerHTML = `
            <div class="alert alert-danger">Error: ${error.message}</div>`;
            } else {
                alertRecuperar.innerHTML = `
            <div class="alert alert-success">
                 Revisa tu correo, te enviamos el enlace.
            </div>`;
                document.getElementById("emailRecuperar").value = "";
            }

            btnRecuperar.disabled = false;
            btnRecuperar.textContent = "Enviar enlace";
        });
    </script>

</body>

</html>
