<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="./Navbar/Navbar.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div id="navbar"></div>
    <main class="main-content">
          <!-- BIENVENIDA -->
         <section class="welcome-section">
            <div class="img-doctor">
                <img src="./images/Dr.Luuk_Herssen.jpeg" alt="" id="foto-doctor">
            </div>
            <div class="welcome-text">
                 <h2 id="nombre-doctor">¡Bienvenido...</h2>
            <span id="especialidad-doctor">Administrador</span>
            </div>
         </section>
        <!-- TARJETAS DE ESTADISTICAS -->
         <section class="stats-section">
            <!-- TARJETAS -->
         </section>
         <!-- GRÁFICAS -->
          <section class="charts-section">
            <div class="pie-chart-card"></div>
            <div class="bar-chart-card"></div>
          </section>
          <!-- FOOTER DE STATS -->
           <section class="bottom-stats">
            <div></div>
            <div></div>
            <div></div>
           </section>
        
    </main>

    
</body>

<script >
    fetch('./Navbar/Navbar.html')
.then(res => res.text())
.then(html =>{
    document.getElementById('navbar').innerHTML = html;

    <!-- CARGAMOS EL SCRIPT DESPUES DE QUE SE INYECTE EL HTML -->
    const script = document.createElement('script');
    script.type = 'module';
    script.src='/admin/Navbar/Navbar.js';
    script.defer = true;
    document.body.appendChild(script);

})
</script>
<script type="module" src="./dashboard.js"></script>

</html>
