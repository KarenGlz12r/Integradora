<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="../../admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Editar Fisioterapeuta</title>
</head>
<body>

    <div id="navbar"></div>

    <main class="containerm">
        <div class="page-header">
            <div class="text">
                <p>Editar fisioterapeuta</p>
            </div>
            <div class="button">
                <a href="./MostrarFisioterapeutas.html" class="btn-registrar">← Ver fisioterapeutas</a>
            </div>
        </div>

        <div class="edit-form-container">
            <form id="form-editar" class="form-grid">
                <div id="alert-container"></div>

                <p class="form-section-title">Información personal</p>
                

                <div class="form-grupo">
                    <label for="nombre">Nombre</label>
                    <input type="text" class="input" id="nombre" required disabled>
                </div>
                <div class="form-grupo">
                    <label for="apellido_paterno">Apellido paterno</label>
                    <input type="text" class="input" id="apellido_paterno" disabled>
                </div>
                <div class="form-grupo">
                    <label for="email_contacto">Email de contacto</label>
                    <input type="email" class="input" id="email_contacto">
                </div>
                <div class="form-grupo">
                    <label for="telefono">Teléfono</label>
                    <input type="text" class="input" id="telefono">
                </div>

                <p class="form-section-title">Información profesional</p>

                <div class="form-grupo">
                    <label for="especialidad">Especialidad</label>
                    <select id="especialidad" class="field-select" onchange="toggleEspecialidadCustom(this)">
                        <option value="">Seleccionar especialidad</option>
                        <option value="ortopedico">Ortopédico</option>
                        <option value="neurologico">Neurológico</option>
                        <option value="musculoesqueletico">Musculoesquelético</option>
                        <option value="respiratorio">Respiratorio</option>
                        <option value="deportivo">Deportivo</option>
                        <option value="__otra__">Otra especialidad...</option>
                    </select>
                    <input id="especialidad_custom" type="text" class="input" placeholder="Escribe la especialidad"
                        style="display:none; margin-top:8px;">
                </div>
                <div class="form-grupo">
                    <label for="cedula_profesional">Cédula profesional</label>
                    <input type="text" class="input" id="cedula_profesional" disabled>
                </div>
                <div class="form-grupo">
                    <label for="anios_experiencia">Años de experiencia</label>
                    <input type="number" min="0" class="input" id="anios_experiencia">
                </div>
                <div class="form-grupo">
                    <label for="turno">Turno</label>
                    <select id="turno" class="field-select">
                        <option value="Mañana">Mañana</option>
                        <option value="Tarde">Tarde</option>
                        <option value="Noche">Noche</option>
                    </select>
                </div>
                <div class="form-grupo">
                    <label for="estado">Estado</label>
                    <select id="estado" class="field-select">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="./MostrarFisioterapeutas.html" class="btn-cancelar">Cancelar</a>
                    <button class="btn-editarR" type="submit">Guardar cambios</button>
                </div>

            </form>
        </div>
    </main>

    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./EditarFisios.js"></script>
    <script type="module" src="./fisioterapeutas.js"></script>
    <script>
        function toggleEspecialidadCustom(sel) {
            const custom = document.getElementById('especialidad_custom');
            if (sel.value === '__otra__') {
                custom.style.display = 'block';
                custom.required = true;
                custom.focus();
            } else {
                custom.style.display = 'none';
                custom.required = false;
                custom.value = '';
            }
        }
        // Llamada desde EditarFisios.js al precargar datos
        function precargarEspecialidad(valor) {
            const sel = document.getElementById('especialidad');
            const custom = document.getElementById('especialidad_custom');
            const opciones = [...sel.options].map(o => o.value);
            if (opciones.includes(valor)) {
                sel.value = valor;
            } else if (valor) {
                sel.value = '__otra__';
                custom.style.display = 'block';
                custom.required = true;
                custom.value = valor;
            }
        }
        function getEspecialidad() {
            const sel = document.getElementById('especialidad');
            if (sel.value === '__otra__') {
                return document.getElementById('especialidad_custom').value.trim();
            }
            return sel.value;
        }
    </script>

</body>
</html>
