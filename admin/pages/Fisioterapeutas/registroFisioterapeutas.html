<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="../../admin.css">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Registrar Fisioterapeuta</title>
</head>
<body>

    <div id="navbar"></div>

    <main class="container">
        <div class="page-header">
            <div class="text">
                <p>Gestión de fisioterapeutas</p>
            </div>
            <div class="button">
                <a href="./MostrarFisioterapeutas.html" class="btn-registrar">Ver fisioterapeutas</a>
            </div>
        </div>

        <form class="form" id="form-registro">

            <div class="form-header">
                <div class="form-header-icon">＋</div>
                <div>
                    <p class="title">Nuevo fisioterapeuta</p>
                    <p class="message">Completa los datos para registrar</p>
                </div>
            </div>

            <div id="alert-container"></div>

            <div class="form-section-title" style="grid-column: 1/-1">Información personal</div>

            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="email">Correo electrónico</label>
                    <input id="email" type="email" class="field-input" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="nombre">Nombre</label>
                    <input id="nombre" type="text" class="field-input" placeholder="Nombre(s)" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="apellido_paterno">Apellido paterno</label>
                    <input id="apellido_paterno" type="text" class="field-input" placeholder="Apellido paterno" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="apellido_materno">Apellido materno</label>
                    <input id="apellido_materno" type="text" class="field-input" placeholder="Apellido materno">
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="telefono">Teléfono</label>
                    <input id="telefono" type="text" class="field-input" placeholder="10 dígitos">
                </div>
                <div class="field-group">
                    <label class="field-label" for="fecha_naci">Fecha de nacimiento</label>
                    <input id="fecha_naci" type="date" class="field-input">
                </div>
            </div>

            <p class="form-section-title">Datos profesionales</p>

            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="especialidad">Especialidad</label>
                    <select id="especialidad" class="field-select" onchange="toggleEspecialidadCustom(this)">
                        <option value="">Seleccionar especialidad</option>
                        <option value="ortopedico">Ortopédico</option>
                        <option value="neurologico">Neurológico</option>
                        <option value="musculoesqueletico">Musculoesquelético</option>
                        <option value="respiratorio">Respiratorio</option>
                        <option value="deportivo">Deportivo</option>
                        <option value="__otra__">Otra especialidad...</option>
                    </select>
                    <input id="especialidad_custom" type="text" class="field-input" placeholder="Escribe la especialidad"
                        style="display:none; margin-top:8px;">
                </div>
                <div class="field-group">
                    <label class="field-label" for="cedula">Cédula profesional</label>
                    <input id="cedula" type="text" class="field-input" placeholder="Número de cédula" required>
                </div>
            </div>

            <div class="form-row">
                <div class="field-group">
                    <label class="field-label" for="anios_experiencia">Años de experiencia</label>
                    <input id="anios_experiencia" type="number" min="0" class="field-input" placeholder="0">
                </div>
                <div class="field-group">
                    <label class="field-label" for="institucion_egreso">Institución de egreso</label>
                    <input id="institucion_egreso" type="text" class="field-input" placeholder="Universidad...">
                </div>
            </div>

            <div class="field-group">
                <label class="field-label" for="turno">Turno (opcional)</label>
                <select id="turno" class="field-select">
                    <option value="">Seleccionar turno</option>
                    <option value="mañana">Mañana</option>
                    <option value="tarde">Tarde</option>
                    <option value="noche">Noche</option>
                </select>
            </div>

            <div class="form-actions">
                <a href="./MostrarFisioterapeutas.html" class="btn-cancelar">Cancelar</a>
                <button type="button" class="submit" onclick="registrarFisioterapeuta()">
                    Registrar fisioterapeuta
                </button>
            </div>

        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init("OO8krxAYwy7wFtUOX");</script>
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '/admin/Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>

    <script>
        // Agrega esto dentro de tu etiqueta <script> en el HTML, o en un archivo JS del frontend

async function registrarFisioterapeuta() {
    // 1. Obtener los valores del formulario HTML
    const emailContacto = document.getElementById('email').value.trim();
    const nombre = document.getElementById('nombre').value.trim();
    const apellidoPaterno = document.getElementById('apellido_paterno').value.trim();
    const apellidoMaterno = document.getElementById('apellido_materno').value.trim();
    const telefono = document.getElementById('telefono').value.trim();
    const fechaNacimiento = document.getElementById('fecha_naci').value;
    const cedula = document.getElementById('cedula').value.trim();
    const aniosExperiencia = parseInt(document.getElementById('anios_experiencia').value);
    const institucionEgreso = document.getElementById('institucion_egreso').value.trim();
    const turno = document.getElementById('turno').value;
    const especialidad = getEspecialidad(); // Tu función existente

    // 2. Validación súper básica (las fuertes están en tu backend)
    if (!emailContacto || !nombre || !apellidoPaterno || !cedula || !especialidad) {
        alert("Por favor, completa todos los campos obligatorios.");
        return;
    }

    // 3. Preparar los datos en el formato que tu Backend (Express) espera
    const bodyData = {
        emailContacto, 
        nombre, 
        apellidoPaterno, 
        apellidoMaterno,
        cedula, 
        especialidad, 
        telefono, 
        aniosExperiencia: isNaN(aniosExperiencia) ? null : aniosExperiencia,
        institucionEgreso, 
        fechaNacimiento, 
        turno
    };

    try {
        // 4. Enviar los datos al Backend (Ruta POST /api/fisioterapeutas)
        // OJO: Si usas 'apiFetch' en tu proyecto, úsalo aquí. 
        // Si usas fetch nativo, recuerda mandar el token JWT en los headers.
        
        // Ajusta la URL base según cómo corra tu servidor local (ej. http://localhost:3000)
        const response = await fetch("https://integradora-production-f593.up.railway.app//api/fisioterapeutas", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // "Authorization": `Bearer ${localStorage.getItem('tu_token_jwt')}` // Descomenta si usas JWT manual
            },
            body: JSON.stringify(bodyData)
        });

        const result = await response.json();

        // 5. Manejar la respuesta del servidor
        if (response.ok && result.ok) {
            alert("¡Fisioterapeuta registrado con éxito!");
            
            // Opcional: Aquí es donde usarías EmailJS para enviar el correo 
            // usando las contraseñas generadas que te devuelve el backend
            console.log("Credenciales generadas (Enviar por email):", result.emailLogin, result.password);
            
            // Limpiar el formulario
            document.getElementById('form-registro').reset();
        } else {
            alert("Error: " + (result.error || "No se pudo registrar"));
        }
    } catch (error) {
        console.error("Error en la petición:", error);
        alert("Error de conexión con el servidor.");
    }
}
        function toggleEspecialidadCustom(sel) {
            const custom = document.getElementById('especialidad_custom');
            if (sel.value === '__otra__') {
                custom.style.display = 'block';
                custom.required = true;
                custom.focus();
            } else {
                custom.style.display = 'none';
                custom.required = false;
                custom.value = '';
            }
        }
        // Helper para obtener el valor final de especialidad
        function getEspecialidad() {
            const sel = document.getElementById('especialidad');
            if (sel.value === '__otra__') {
                return document.getElementById('especialidad_custom').value.trim();
            }
            return sel.value;
        }
    </script>

</body>
</html>
