<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="../../admin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de fisioterapeutas</title>
</head>

<body>
    <div id="navbar"></div>
    <main class="container">

        <!-- FORMULARIO DE REGISTRO -->
        <form action="" class="form">
            <p class="title">Registro</p>
            <p class="message">Registrar fisioterapeutas</p>
            <!-- ALERTA -->
            <div id="alert-container"></div>
            <div class="flex">
                <label for="">
                    <input id="email" type="email" placeholder=" " required class="input">
                    <span>Correo: </span>
                </label>
                <label for="">
                    <input id="nombre" type="text" placeholder=" " required class="input">
                    <span>Nombre:</span>
                </label>
                <label for="">
                    <input id="apellido_paterno" type="text" placeholder=" " required class="input">
                    <span>Apellido Paterno</span>
                </label>
                <label for="">
                    <input id="apellido_materno" type="text" placeholder=" " class="input">
                    <span>Apellido Materno</span>
                </label>
            </div>

            <label for="">
                <input id="telefono" type="text" placeholder=" " class="input">
                <span>Teléfono</span>
            </label>
            <label for="">
                <input id="fecha_naci" type="date" placeholder=" " class="input">
                <span>Fecha de nacimiento</span>
            </label>

            <label for="especialidad">
                Datos profesionales:
            </label>
            <select name="" id="especialidad">
                <option value="">Seleccionar especialidad</option>
                <option value="ortopedico">Ortopédico</option>
                <option value="neurologico">Neurológico</option>
                <option value="musculoesqueletico">Musculoesquelético</option>
                <option value="respiratorio">Respiratorio</option>
                <option value="deportivo">Deportivo</option>
            </select>
            <label for="">
                <input id="anios_experiencia" type="number" min="0" placeholder=" " class="input">
                <span>Años de experiencia</span>
            </label>
            <label for="">
                <input id="institucion_egreso" type="text" placeholder=" " class="input">
                <SPan>Institución</SPan>
            </label>
            <label for="">
                <input id="cedula" type="text" placeholder=" " required class="input">
                <span>Cedula profesional</span>
            </label>

            <label for="turno">Turno (opcional):</label>
            <select id="turno">
                <option value="">Seleccionar turno</option>
                <option value="mañana">Mañana</option>
                <option value="tarde">Tarde</option>
                <option value="noche">Noche</option>
            </select>

            <button onclick="registrarFisioterapeuta()" class="submit" type="button">Registrar</button>
        </form>

        <hr>
    </main>

    <script type="module">
        import {
            registrarFisioterapeuta
        } from "./auth.js";

        window.registrarFisioterapeuta = registrarFisioterapeuta;
    </script>
    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;

                <!-- CARGAMOS EL SCRIPT DESPUES DE QUE SE INYECTE EL HTML -->
                const script = document.createElement('script');
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);

            })
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ENVIAR CORREO -->
     <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
    emailjs.init("OO8krxAYwy7wFtUOX"); 
</script>
</body>


</html>
