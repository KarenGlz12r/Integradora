<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../Navbar/Navbar.css">
    <link rel="stylesheet" href="../../admin.css">
    <title>Fisioterapeutas</title>
</head>
<body>

    <div id="navbar"></div>

    <main class="containerm">
        <div class="page-header">
            <div class="text"><p>Gestión de fisioterapeutas</p></div>
            <div class="button">
                <a href="./registroFisioterapeutas.html" class="btn-registrar">+ Registrar fisioterapeuta</a>
            </div>
        </div>

        <div class="fisio-content">
            <div class="fisio-table-container">
                <table class="fisio-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Especialidad</th>
                            <th>Pacientes</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-fisioterapeutas"></tbody>
                </table>
            </div>

            <div class="fisio-detail" id="fisio-detail">
                <p class="detail-placeholder">Selecciona un fisioterapeuta para ver sus detalles</p>
            </div>
        </div>
    </main>

    <script>
        fetch('../../Navbar/Navbar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('navbar').innerHTML = html;
                const script = document.createElement('script');
                script.type = 'module';
                script.src = '../../Navbar/Navbar.js';
                document.body.appendChild(script);
            });
    </script>
    <script type="module" src="./fisioterapeutas.js"></script>

</body>
</html>
