<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Navbar.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Navbar</title>
</head>
<body>

    <header>
        <div class="left">
            <div class="menu-container">
                <div class="menu" id="menu">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            <div class="brand">MOTRICARE</div>
        </div>

        <div class="right">
            <div class="user-name">
                <h2 id="name-user" class="nombre"></h2>
            </div>

            <div class="user-menu">
                <div class="user-avatar" onclick="toggleDropdown()">
                    <img src="/cliente/icons/user-svgrepo-com.svg" alt="Avatar" id="user-foto">
                </div>
                <div class="dropdown" id="dropdown">
                    <ul>
                        <li onclick="abrirSelectorFoto()">
                            <img src="/cliente/icons/user-svgrepo-com.svg" alt="">
                            <span>Editar foto de perfil</span>
                        </li>
                        <li onclick="abrirModalCerrarSesion()">
                            <img src="/cliente/icons/logout-svgrepo-com.svg" alt="">
                            <span>Cerrar sesión</span>
                        </li>
                    </ul>
                </div>
                <input type="file" id="input-foto" accept="image/*" style="display:none" onchange="subirFoto(event)">
            </div>
        </div>
    </header>

    <div class="sidebar" id="sidebar">
        <nav>
            <div class="sidebar-logo">
                <img src="/admin/images/Logo2-Motricare.jpeg" alt="Motricare">
            </div>
            <ul>
                <li>
                    <a href="/admin/dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        <span>Inicio</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/pages/Fisioterapeutas/MostrarFisioterapeutas.html">
                        <i class="fa-solid fa-book-medical"></i>
                        <span>Fisioterapeutas</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/pages/Pacientes/MostrarPacientes.html">
                        <i class="fa-solid fa-users"></i>
                        <span>Pacientes</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/Reportes/reportes.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Reportes</span>
                    </a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Modal confirmación cerrar sesión -->
    <div class="modal-overlay" id="modal-logout">
        <div class="modal-card">
            <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
            <h3>¿Cerrar sesión?</h3>
            <p>¿Estás seguro de que deseas cerrar tu sesión?</p>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-confirmar" onclick="cerrarSesion()">Sí, salir</button>
            </div>
        </div>
    </div>

</body>
</html>
